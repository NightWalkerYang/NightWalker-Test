<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw - 下载客户端</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
    }
    .hero {
      text-align: center;
      max-width: 640px;
    }
    .hero h1 {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #1b6ef3, #6dd5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 18px;
      color: #8b98a5;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .download-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }
    .download-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 28px 20px;
      border: 1px solid #2f3336;
      border-radius: 12px;
      background: #16202a;
      text-decoration: none;
      color: #e7e9ea;
      transition: border-color 0.2s, transform 0.2s;
    }
    .download-card:hover {
      border-color: #1b6ef3;
      transform: translateY(-2px);
    }
</style>
</head>
<body>
  <div class="hero">
    <h1>OpenClaw</h1>
    <p>AI Agent 工作平台。购买并使用 Agent 和 Skills，按量计费，开箱即用。</p>
  </div>
  <div class="download-cards">
    <a class="download-card" href="releases/OpenClaw_latest_x64-setup.msi">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1b6ef3" stroke-width="1.5">
        <rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/>
        <rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>
      </svg>
      <strong>Windows</strong>
      <span style="font-size:13px;color:#8b98a5">Windows 10+, 64-bit</span>
    </a>
    <a class="download-card" href="releases/OpenClaw_latest_aarch64.dmg">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1b6ef3" stroke-width="1.5">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M15 8.5c.83 0 1.5-.67 1.5-1.5S15.83 5.5 15 5.5s-1.5.67-1.5 1.5.67 1.5 1.5 1.5z"/>
      </svg>
      <strong>macOS</strong>
      <span style="font-size:13px;color:#8b98a5">macOS 11+, Apple Silicon / Intel</span>
    </a>
    <a class="download-card" href="releases/OpenClaw_latest_amd64.AppImage">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1b6ef3" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>
      </svg>
      <strong>Linux</strong>
      <span style="font-size:13px;color:#8b98a5">AppImage, 64-bit</span>
    </a>
  </div>
</body>
</html>
