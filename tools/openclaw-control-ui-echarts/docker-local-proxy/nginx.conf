worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 18789;
    server_name _;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /download/ {
      alias /srv/download/;
      index index.html;
      try_files $uri $uri/ =404;
      add_header Cache-Control "public, max-age=3600";
    }

    location /workspace-downloads/ {
      alias /srv/workspace-downloads/;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300";
    }

    location /workspace-agent-downloads/ {
      alias /srv/workspace-agent-downloads/;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300";
    }

    location /tenant-platform-api/ {
      proxy_pass http://openclaw-tenant-platform:18801;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      proxy_pass http://openclaw-gateway:18789;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
