<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="oc-tenant-api-base" content="/tenant-platform-api/v1" />
    <title>苏博泰克 租户管理台</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/runtime/tenant/page.css" />
    <script type="module" src="./assets/runtime/tenant/admin-page.js"></script>
  </head>
  <body>
    <main class="tenant-page" data-oc-tenant-admin-page>
      <section class="tenant-shell">
        <article class="tenant-card">
          <div class="tenant-item__row" style="justify-content:space-between;">
            <div>
              <p class="tenant-eyebrow">Tenant Admin</p>
              <h1 class="tenant-title">租户管理员工作台</h1>
              <p class="tenant-subtitle">
                当前管理员：<strong data-tenant-admin-name>tenant-admin</strong>，
                当前租户：<strong data-tenant-admin-tenant>租户</strong>。
              </p>
              <p class="tenant-subtitle">平台管理员负责把 Agent 下发到租户；租户管理员只负责成员维护与成员分配。</p>
            </div>
            <button class="tenant-btn tenant-btn--ghost" type="button" data-tenant-admin-logout>退出登录</button>
          </div>
        </article>

        <section class="tenant-grid">
          <article class="tenant-panel">
            <div class="tenant-panel__head">
              <div>
                <h2>新增成员</h2>
                <p class="tenant-subtitle">账号密码由租户管理员手工设置，创建后直接启用。</p>
              </div>
            </div>
            <form class="tenant-form" data-tenant-member-form>
              <label class="tenant-field">
                <span>成员账号</span>
                <input name="username" type="text" required />
              </label>
              <label class="tenant-field">
                <span>成员密码</span>
                <input name="password" type="password" required />
              </label>
              <button class="tenant-btn tenant-btn--primary" type="submit">创建成员</button>
            </form>
          </article>

          <article class="tenant-panel">
            <div class="tenant-panel__head">
              <div>
                <h2>成员分配 Agent</h2>
                <p class="tenant-subtitle">只能从平台已下发给当前租户的 Agent 中进行分配。</p>
              </div>
            </div>
            <form class="tenant-form" data-tenant-assignment-form>
              <label class="tenant-field">
                <span>成员</span>
                <select name="userId"></select>
              </label>
              <label class="tenant-field">
                <span>租户 Agent</span>
                <select name="tenantAgentId"></select>
              </label>
              <button class="tenant-btn tenant-btn--primary" type="submit">完成分配</button>
            </form>
          </article>
        </section>

        <section class="tenant-grid">
          <article class="tenant-panel">
            <h2>成员列表</h2>
            <div class="tenant-list" data-tenant-members></div>
          </article>
          <article class="tenant-panel">
            <h2>租户已分配 Agent</h2>
            <div class="tenant-list" data-tenant-agent-list></div>
          </article>
        </section>

        <p class="tenant-feedback" data-tenant-feedback>租户管理员页面已就绪。</p>
      </section>
    </main>
  </body>
</html>
