<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="oc-tenant-api-base" content="/tenant-platform-api/v1" />
    <title>苏博泰克 租户平台登录</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/runtime/tenant/page.css" />
    <script type="module" src="./assets/runtime/tenant/login-page.js"></script>
  </head>
  <body>
    <main class="tenant-page" data-oc-tenant-login-page>
      <section class="tenant-shell" style="max-width:780px;">
        <article class="tenant-card">
          <p class="tenant-eyebrow">SPTC Tenant Platform</p>
          <h1 class="tenant-title">租户平台登录</h1>
          <p class="tenant-subtitle">
            所有人先进入登录页。平台管理员、租户管理员和租户成员在登录后会自动跳转到各自页面。
          </p>
        </article>

        <article class="tenant-card">
          <form class="tenant-form tenant-form--inline" data-tenant-api-base-form>
            <label class="tenant-field" style="grid-column:1/-1;">
              <span>租户平台 API 基地址</span>
              <input name="apiBase" type="text" placeholder="/tenant-platform-api/v1" />
            </label>
            <button class="tenant-btn tenant-btn--ghost" type="submit">保存 API 地址</button>
          </form>
        </article>

        <article class="tenant-card" data-tenant-setup-card hidden>
          <p class="tenant-eyebrow">Bootstrap</p>
          <h2 class="tenant-title" style="font-size:26px;">初始化平台管理员</h2>
          <form class="tenant-form" data-tenant-setup-form>
            <label class="tenant-field">
              <span>平台管理员账号</span>
              <input name="username" type="text" required />
            </label>
            <label class="tenant-field">
              <span>平台管理员密码</span>
              <input name="password" type="password" required />
            </label>
            <div class="tenant-actions">
              <button class="tenant-btn tenant-btn--primary" type="submit">完成初始化</button>
            </div>
          </form>
        </article>

        <article class="tenant-card" data-tenant-login-card hidden>
          <p class="tenant-eyebrow">Login</p>
          <h2 class="tenant-title" style="font-size:26px;">账号密码登录</h2>
          <form class="tenant-form" data-tenant-login-form>
            <label class="tenant-field">
              <span>账号</span>
              <input name="username" type="text" required />
            </label>
            <label class="tenant-field">
              <span>密码</span>
              <input name="password" type="password" required />
            </label>
            <div class="tenant-actions">
              <button class="tenant-btn tenant-btn--primary" type="submit">登录</button>
            </div>
          </form>
        </article>

        <p class="tenant-feedback" data-tenant-feedback>正在检查租户平台初始化状态...</p>
      </section>
    </main>
  </body>
</html>
