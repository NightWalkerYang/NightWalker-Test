<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="oc-tenant-api-base" content="/tenant-platform-api/v1" />
    <title>苏博泰克 平台管理登录</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/runtime/tenant/page.css" />
    <script type="module" src="./assets/runtime/tenant/platform-login-page.js"></script>
  </head>
  <body>
    <main class="tenant-auth-page" data-oc-platform-login-page>
      <section class="tenant-auth-shell">
        <aside class="tenant-auth-hero">
          <p class="tenant-auth-hero__eyebrow">Platform Console</p>
          <h1 class="tenant-auth-hero__title">平台管理员入口</h1>
          <p class="tenant-auth-hero__desc">
            平台管理员从这里完成初始化、租户创建、租户管理员创建、租户 Agent 下发与平台级运营管理。
          </p>
          <ul class="tenant-auth-points">
            <li>首次进入时，在这里初始化平台管理员账号。</li>
            <li>一个租户只允许一个租户管理员。</li>
            <li>租户可用 Agent 由平台管理员统一分配。</li>
          </ul>
          <a class="tenant-auth-link" href="./tenant-login.html" data-tenant-login-link>转到租户登录入口</a>
        </aside>

        <section class="tenant-auth-card">
          <article class="tenant-auth-card__block">
            <p class="tenant-eyebrow">API</p>
            <form class="tenant-form tenant-form--inline" data-tenant-api-base-form>
              <label class="tenant-field" style="grid-column: 1/-1;">
                <span>租户平台 API 基地址</span>
                <input name="apiBase" type="text" placeholder="/tenant-platform-api/v1" />
              </label>
              <button class="tenant-btn tenant-btn--ghost" type="submit">保存 API 地址</button>
            </form>
          </article>

          <article class="tenant-auth-card__block" data-tenant-setup-card hidden>
            <p class="tenant-eyebrow">Bootstrap</p>
            <h2 class="tenant-title tenant-title--compact">初始化平台管理员</h2>
            <form class="tenant-form" data-tenant-setup-form>
              <label class="tenant-field">
                <span>平台管理员账号</span>
                <input name="username" type="text" required />
              </label>
              <label class="tenant-field">
                <span>平台管理员密码</span>
                <input name="password" type="password" required />
              </label>
              <div class="tenant-actions">
                <button class="tenant-btn tenant-btn--primary" type="submit">完成初始化</button>
              </div>
            </form>
          </article>

          <article class="tenant-auth-card__block" data-tenant-login-card hidden>
            <p class="tenant-eyebrow">Platform Login</p>
            <h2 class="tenant-title tenant-title--compact">平台管理员登录</h2>
            <form class="tenant-form" data-tenant-login-form>
              <label class="tenant-field">
                <span>账号</span>
                <input name="username" type="text" required />
              </label>
              <label class="tenant-field">
                <span>密码</span>
                <input name="password" type="password" required />
              </label>
              <div class="tenant-actions">
                <button class="tenant-btn tenant-btn--primary" type="submit">进入平台管理台</button>
              </div>
            </form>
          </article>

          <p class="tenant-feedback" data-tenant-feedback>正在检查平台初始化状态...</p>
        </section>
      </section>
    </main>
  </body>
</html>
