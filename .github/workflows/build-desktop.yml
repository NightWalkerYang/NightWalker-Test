name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rename: OpenClaw_latest_x64-setup.msi
            glob: "**/*.msi"
          - platform: macos-latest
            target: aarch64-apple-darwin
            rename: OpenClaw_latest_aarch64.dmg
            glob: "**/*.dmg"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rename: OpenClaw_latest_amd64.deb
            glob: "**/*.deb"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/openclaw-control-ui-echarts/desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Create build resource stubs
        shell: bash
        run: |
          cd tools/openclaw-control-ui-echarts
          touch runtime.env
          mkdir -p scripts data
          cp desktop/scripts/openclaw-desktop-runtime.mjs scripts/ || true
          cp local-runtime/openclaw.local.example.json5 . || true
          touch data/.gitkeep

      - name: Install frontend dependencies
        working-directory: tools/openclaw-control-ui-echarts/desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tools/openclaw-control-ui-echarts/desktop

      - name: Prepare release artifact
        shell: bash
        run: |
          mkdir -p release-out
          find tools/openclaw-control-ui-echarts/desktop/src-tauri/target/release/bundle -name "$(echo '${{ matrix.glob }}' | sed 's/\*\*\///')" | head -1 | while read f; do
            cp "$f" "release-out/${{ matrix.rename }}"
          done
          ls -la release-out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-out/${{ matrix.rename }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "artifacts/desktop-windows-latest/*,artifacts/desktop-macos-latest/*,artifacts/desktop-ubuntu-22.04/*"
          target: /home/root-ai/openclaw/open-claw/tools/openclaw-control-ui-echarts/desktop/download-page/releases/
          strip_components: 2
          overwrite: true
