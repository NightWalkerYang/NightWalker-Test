		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"表单-运行时模型层-插件事件接口-数据包初始化事件\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"表单运行时模型层插件事件接口，提供数据包初始化事件\n \n 插件抽象基类 <tt>@see kd.bos.form.plugin.AbstractFormPlugin</tt> 实现了本接口，可基于此抽象基类定义插件\n \n 示例：定义一个表单插件，从插件抽象基类派生<pre><code> \npublic class DemoFormPlugin extends AbstractFormPlugin {\n\n}</code></pre>","commented":11,"declare":"public interface IDataModelListener","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"复制数据包完成后触发此事件\n \n 插件可在此事件，填充不允许复制的字段值","constructor":false,"modifiers":"default","name":"afterCopyData","paramNames":["e"],"paramTypes":["java.util.EventObject"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"数据包创建之后的事件\n \n 插件在此，对已创建好的模型数据包进一步加工，比如调整字段默认值，增加单据体默认行等\n \n 示例：<pre><code>\n public class DemoFormPlugin extends AbstractFormPlugin {\n &#64Override\n public void afterCreateNewData(EventObject e) {\n }\n }</code></pre>","constructor":false,"modifiers":"default","name":"afterCreateNewData","paramNames":["e"],"paramTypes":["java.util.EventObject"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，未含特别参数","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"引入数据填写完毕之后，保存前触发的事件\n \n 批量引入时，每张单据都触发一次\n 插件可以对已完成引入，但还未保存的数据包，进行最后的修改","constructor":false,"modifiers":"default","name":"afterImportData","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.ImportDataEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，含引入数据源","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"引入数据填写之前触发的事件\n \n 批量引入时，每张单据都触发一次\n 插件可以对本次引入的源单数据包，进行修订；或者取消本单引入","constructor":false,"modifiers":"default","name":"beforeImportData","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.BeforeImportDataEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，含引入数据源","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"单据体引入过程中，解析Excel文件至JSON数据包解析完毕，即将转换为动态对象之前的事件 ，可在这个事件中修改/校验当前批次解析到的数据包","constructor":false,"modifiers":"default","name":"beforeImportEntry","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.BeforeImportEntryEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"创建数据包事件，一般在页面初始化时调用\n \n 插件可在此事件，自行构建模型数据包，后续平台将把插件构建的数据包显示在界面上\n 如果插件不处理此事件，平台会自行构建空白的模型数据包，并给每个字段填好默认值\n \n 示例：<pre><code>\n public class DemoFormPlugin extends AbstractFormPlugin {</code>","constructor":false,"modifiers":"default","name":"createNewData","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.BizDataEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，插件可通过此参数传入自行创建的表单界面数据包","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"获取主实体对象时触发此事件\n \n 插件可在此事件，向主实体动态注册新属性，以实现给表单动态添加字段的效果\n 特别注意：主实体对象是共享的，不允许直接修改主实体对象本身。必须先复制，然后在拷贝的主实体对象上动态注册新属性","constructor":false,"modifiers":"default","name":"getEntityType","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.GetEntityTypeEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，含默认的主实体对象","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"批量引入数据之前触发此事件，只触发一次\n \n 插件可在此事件，分析引入数据源，批量读取依赖的基础资料数据","constructor":false,"modifiers":"default","name":"initImportData","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.InitImportDataEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，含引入数据源","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"加载数据包事件，在单据从数据库读取数据时触发\n \n 插件可在此事件，自行完成取数","constructor":false,"modifiers":"default","name":"loadData","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.LoadDataEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，插件可以通过此参数传入自取的模型数据包","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"单据引入，批量匹配依赖的基础数据事件\n \n 引入源数据包中，基础资料字段通常填写数据编码，引入过程需要先把编码转为内码后再填写到字段上\n 默认情况，平台会自动根据组织和编码搜索基础数据的内码，不需要插件干预\n 某些特殊基础数据，编码不唯一，此时需要插件来完成数据编码到内码的转换，否则会引入失败","constructor":false,"modifiers":"default","name":"queryImportBasedata","paramNames":["e"],"paramTypes":["kd.bos.entity.datamodel.events.QueryImportBasedataEventArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"e 事件参数，含需由插件完成转换的基础数据","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IDataModelListener","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
