		const cm={"allInterfaces":[],"annotations":[{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"}],"comment":"消息生产者：支持普通消息、延迟消息（最多延迟2小时）、数据库事务消息\n 默认不使用事务，因为事务成本高，生产者代码示例如下：\n <pre><code>\n    // 创建生产者对象，传入region和queue需与xml文件的定义一致\n    MessagePublisher messagePublisher = MQFactory.get().createSimplePublisher(\"demo\", \"demo_queue\");\n    try {\n        // 发送普通消息，可发送Object对象\n        messagePublisher.publish(\"message body\");\n        // 发送600秒的延迟消息，最多延迟2小时，单位秒\n        messagePublisher.publishDelay(\"delay message body\", 600);\n    } catch (Exception e) {\n        // 发送消息异常，打印异常日志\n        logger.error(\"mq publish error\", e);\n        // 记录业务日志，TODO\n    } finally {\n        // 生产者对象需及时关闭，防止IO泄漏\n        messagePublisher.close();\n    }\n </code></pre>","commented":12,"declare":"public interface MessagePublisher","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":false,"isService":false,"methods":[{"annotations":[],"comment":"关闭IO资源，编写在finally块\n 创建完生产者，可发送1条或n条消息，发送完毕后须立即关闭生产者释放IO资源","constructor":false,"modifiers":"","name":"close","paramNames":[],"paramTypes":[],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[],"throwExceptions":[]},{"annotations":[],"comment":"发送普通消息，消息过大会抛异常，这是为了避免因消息过大导致系统性能下降或出现其他问题","constructor":false,"modifiers":"","name":"publish","paramNames":["message"],"paramTypes":["byte[]"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"message 消息内容，类型：byte[]，建议小于512Kb","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"发送普通消息，消息过大会抛异常，这是为了避免因消息过大导致系统性能下降或出现其他问题","constructor":false,"modifiers":"","name":"publish","paramNames":["message"],"paramTypes":["java.lang.String"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"message 消息内容，类型：String，建议小于512Kb","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"发送普通消息，消息过大会抛异常，这是为了避免因消息过大导致系统性能下降或出现其他问题","constructor":fal 他问题","constructor":false,"modifiers":"","name":"publishInDbTranscation","paramNames":["message"],"paramTypes":["java.lang.Object"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"message 消息内容，建议小于512Kb","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"MessagePublisher","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
