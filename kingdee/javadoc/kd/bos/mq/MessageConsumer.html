		const cm={"allInterfaces":[],"annotations":[{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"}],"comment":"消息消费接口，实现该接口接收对应的消息，示例如下：\n <pre><code>\n      public class DemoConsumer implements MessageConsumer {\n          public void onMessage(Object message, String messageId, boolean resend, MessageAcker acker) {\n              try {\n                  //业务处理\n                  acker.ack(messageId);\n              } catch (Throwable e) {\n                  boolean discard = e instanceof IOException; //是否废弃这条消息，根据具体场景判断\n                  if (discard){\n                      acker.discard(messageId);//丢弃\n                      // 记录废弃原因，并写业务日志\n                  } else{\n                      acker.deny(messageId);//告诉mq重发这条消息\n                      // 记录异常原因，并写业务日志\n                  }\n              }\n          }\n          //当事务敏感，发送方和消费方不在同一个库时，需要重写设置消费方的routekey\n          String getRouteKey() {\n              return \"consumerDbRouteKey\";\n          }\n      }\n\n </code></pre>","commented":3,"declare":"public interface MessageConsumer","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":false,"isService":false,"methods":[{"annotations":[],"comment":"若生产者发送db事务消息，发送方和消费方不在同一个库时，需要设置消费方的数据库路由标识RouteKey","constructor":false,"modifiers":"default","name":"getRouteKey","paramNames":[],"paramTypes":[],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"数据库路由标识RouteKey","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"消费生产者发送的消息","constructor":false,"modifiers":"","name":"onMessage","paramNames":["message","messageId","resend","acker"],"paramTypes":["java.lang.Object","java.lang.String","boolean","kd.bos.mq.MessageAcker"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"message 消息内容，Object类型，需自行强转为生产者发送的类型","name":"@param","ownerType":"METHOD"},{"comment":"messageId 消息id，用于消息确认，非全局唯一","name":"@param","ownerType":"METHOD"},{"comment":"resend 是否重新发送，此参数不准确，禁止用于幂等性判定。场景如下：1、前面发送的没有确认成功，mq服务器会重复发送过来；2、mq服务器不稳定也可能重复推送","name":"@param","ownerType":"METHOD"},{"comment":"acker 消息确认器，支持消息确认ack、拒绝deny和丢弃discard","name":"@param","ownerType":"METHOD"},{"comment":"kd.bos.mq.MessageAcker","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"MessageConsumer","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
