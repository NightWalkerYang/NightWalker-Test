"annotations":[],"comment":"过滤容器初始化的处理方法,页面加载和点击搜索时触发\n 示例：<pre><code>\n &#64;Override\n public void filterContainerInit(FilterContainerInitArgs args) {\n // 获取 datefield字段\n FilterColumn filterColumn = args.getFilterColumn(\"datefield\");\n // 给字段设置默认值\n filterColumn.setDefaultValues(\"2019-1-30\", \"2019-1-31\");\n // 创建一个textfield字段\n FilterColumn filterColumn2 = new FilterColumn(\"textfield\");\n // 添加到字段元数据集合\n args.addFilterColumn(filterColumn2);\n // 创建一个combofield 通用过滤字段\n CommonFilterColumn commonFilterColumn = new CommonFilterColumn(\"combofield\");\n // 添加到字段元数据集合\n args.addFilterColumn(commonFilterColumn);\n // 创建一个combofield 方案过滤字段\n SchemeFilterColumn schemeFilterColumn = new SchemeFilterColumn(\"combofield\");\n // 添加到字段元数据集合\n args.addFilterColumn(schemeFilterColumn);\n super.filterContainerInit(args);\n }\n </code></pre>","constructor":false,"modifiers":"","name":"filterContainerInit","paramNames":["args"],"paramTypes":["kd.bos.form.events.FilterContainerInitArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args <a href='?nav=class&module=kd.bos.kddm&package=kd.bos.list.plugin&name=FilterContainerInitArgs'>FilterContainerInitArgs</a>","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"列表方案校验","constructor":false,"modifiers":"default","name":"filterContainerSchemeValidate","paramNames":["args"],"paramTypes":["FilterSchemeDto"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args","name":"@param","ownerType":"METHOD"},{"comment":"","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"过滤容器搜索点击的处理方法,此事件之前先触发filterContainerInit\n 示例：<pre>  <code>\n &#64;Override\n public void filterContainerSearchClick(FilterContainerSearchClickArgs args) {\n // 添加常用过滤条件（日期常量“今天”）\n args.addConstFilter(\"datefield\", CompareTypeEnum.TODAY);\n // 添加快速过滤条件\n args.addFastFilter(\"textfield\", \"test\");\n // 添加方案过滤条件\n args.addFilter(\"textfield\", CompareTypeEnum.EQUAL, \"123\");\n super.filterContainerSearchClick(args);\n }\n </code></pre>","constructor":false,"modifiers":"","name":"filterContainerSearchClick","paramNames":["args"],"paramTypes":["FilterContainerSearchClickArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args 过滤容器搜索点击参数 <a href='?nav=class&module=kd.bos.kddm&package=kd.bos.list.plugin&name=FilterContainerSearchClickArgs'>FilterContainerSearchClickArgs</a>","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"新版过滤模式下提供了基础资料模糊查询功能，如果不需要此功能可以通过重写此方法来关闭\n <p>\n 示例：通过脚本插件关闭字段名为basedatafield的基础资料字段的模糊查询功能\n <pre> <code>\n var plugin = new ListPlugin({\n \tfilterContainerSetBaseDataSearchClosed:function(e) {\n \te.addFieldName(\"basedatafield\");\n }\n </code></pre>","constructor":false,"modifiers":"","name":"filterContainerSetBaseDataSearchClosed","paramNames":["args"],"paramTypes":["SetFilterContainerBaseDataSearchClosedEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"应用范围列表表头字段过滤比较符排序列表表头下拉列表移除部分字段功能说明\n 示例场景：\n 1. 列表上需要将文本字段（textfield）的第一个比较符移除掉\n 2. 列表上需要将下拉列表字段（combofield）的第一项内容移除掉 <br >\n 示例：<pre>  <code>\n &#64;Override\n public void listColumnCompareTypesSet(ListColumnCompareTypesSetEvent args) {\n ListColumnCompareType[] array;\n if (\"textfield\".equals(args.getListFieldKey())) {\n args.getListColumnCompareTypes().remove(0);\n array = args.getListColumnCompareTypes().toArray(new ListColumnCompareType[0]);\n Arrays.sort(array, (o1, o2) -> {\n return Integer.valueOf(o1.getId()).compareTo(Integer.valueOf(o2.getId()));\n });\n\n args.setListColumnCompareTypes(Arrays.asList(array));\n } else if (\"combofield\".equals(args.getListFieldKey())) {\n args.getComboItems().remove(0);\n }\n\n super.listColumnCompareTypesSet(args);\n }\n </code></pre>","constructor":false,"modifiers":"","name":"listColumnCompareTypesSet","paramNames":["args"],"paramTypes":["ListColumnCompareTypesSetEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args 插件参数 <a href='?nav=class&module=kd.bos.kddm&package=kd.bos.list.plugin&name=ListColumnCompareTypesSetEvent'>ListColumnCompareTypesSetEvent</a>","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"通过插件方式关闭已选合计\n <p>\n 示例：脚本插件\n <pre>  <code>\n var plugin = new ListPlugin({\n \tsetEnableCustomSum:function(e) {\n \te.setEnableCustomSum(true);\n }\n </code></pre>","constructor":false,"modifiers":"","name":"setEnableCustomSum","paramNames":["args"],"paramTypes":["kd.bos.list.events.EnableCustomSumEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args <a href='?nav=class&module=kd.bos.kddm&package=kd.bos.list.plugin&name=EnableCustomSumEvent'>EnableCustomSumEvent</a>","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"基础资料F7界面默认开启简单分页模式，有些场景需要开启跳页模式，使用此方法开启\n <p>\n 示例：脚本插件\n <pre>  <code>\n var plugin = new ListPlugin({\n \tsetIndexMode:function(e) {\n \te.setIndexMode(true);\n }\n </code></pre>","constructor":false,"modifiers":"","name":"setIndexMode","paramNames":["args"],"paramTypes":["kd.bos.list.events.IndexModeSetEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args <a href='?nav=class&module=kd.bos.kddm&package=kd.bos.list.plugin&name=IndexModeSetEvent'>IndexModeSetEvent</a>","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"背景 业务员想要自定义列表的多个字段排序，这样就可以按照自己关注的数据维度进行列表数据查看。\n <p>\n 2、支持排序的字段范围 可开放的字段为列表设计器上的单头字段（除图片、附件、基础资料、多选基础资料、多类别基础资料外），需要在插件中指定字段范围。\n <p>\n 2.1 监听操作项点击事件 示例：\n multifieldsort即新建操作项标识\n <p>\n <p>\n /** 当标识为multifieldsort的按钮点击时触发多字段排序请求\n\n <pre> <code>\n &#64;Override\n public void itemClick(ItemClickEvent evt) {\n if (\"multifieldsort\".equals(evt.getItemKey())) {\n this.getView().invokeOperation(\"multifieldsort\");\n }\n super.itemClick(evt);\n }\n </code></pre>\n <p>\n 2.2 指定能够用于多字段排序的表格列表字段\n <pre> <code>\n &#64;Override\n public void setMultiSortFields(MultiFieldsSortEvent multiFieldsSortEvent) {\n       multiFieldsSortEvent.addMultiSortField(\"textfield\");\n       multiFieldsSortEvent.addMultiSortField(\"datefield\");\n       super.setMultiSortFields(multiFieldsSortEvent);\n }\n </code></pre>","constructor":false,"modifiers":"","name":"setMultiSortFields","paramNames":["args"],"paramTypes":["kd.bos.list.events.MultiFieldsSortEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args 插件参数 <a href='?nav=class&module=kd.bos.kddm&package=kd.bos.list.plugin&name=MultiFieldsSortEvent'>MultiFieldsSortEvent</a>","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"列表“计算合计”需要用户点击后触发，\n 如果数据量不是太大，没有性能问题，需要优化用户体验时，可以重写此方法，\n 用于页面加载时同时“计算合计”\n 示例：<pre>  <code>\n &#64;Override\n public void sumDataLoadOnFirstSet(SumDataLoadOnFirstSetEvent args) {\n args.setSumDataLoadOnFirst(true);\n super.sumDataLoadOnFirstSet(args);\n }\n </code></pre>","constructor":false,"modifiers":"","name":"sumDataLoadOnFirstSet","paramNames":["args"],"paramTypes":["SumDataLoadOnFirstSetEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args 插件参数 <a href='?nav=class&module=kd.bos.kddm&package=kd.bos.list.plugin&name=SumDataLoadOnFirstSetEvent'>SumDataLoadOnFirstSetEvent</a>","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IPCListPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
