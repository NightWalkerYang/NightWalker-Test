		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"业务场景二次扩展通用接口\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"通用的二次扩展接口\n <p>\n 业务场景可以直接使用此接口接入二次扩展插件，\n 也可以自行定义接口、参数，更加灵活。\n 使用 <a href='?nav=class&module=kd.bos.extplugin&package=kd.bos.extplugin&name=StdExtPluginProxy'>StdExtPluginProxy</a> 配合使用本接口。\n\n 示例代码：\n <code>\n        StdExtPluginProxy stdExtPluginProxy = StdExtPluginProxy.create(\"kd.bos.extplugin.sample.universal.XXXBizFormPlugin\");\n\n        // 准备触发before事件\n        ExtEvent beforeEvent = new ExtEvent(\"before\");\n        beforeEvent.putEventArg(\"opParam\", arg);        // 可传入多个参数值，参数标识可按需要灵活调整\n\n        stdExtPluginProxy.fireExtEvent(beforeEvent);\n        Boolean cancel = (Boolean) beforeEvent.getEventArg(\"cancel\");\n        if (cancel != null && cancel) {\n        return;\n        }\n\n        // todo 预置的业务逻辑\n\n        // 准备触发after事件\n        ExtEvent afterEvent = new ExtEvent(\"after\");\n        afterEvent.putEventArg(\"result\", arg);\n        stdExtPluginProxy.fireExtEvent(afterEvent);\n\n        // 触发release事件，释放资源\n        stdExtPluginProxy.release();\n </code>","commented":3,"declare":"public interface StdExtPlugin","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"扩展事件","constructor":false,"modifiers":"","name":"extEvent","paramNames":["event"],"paramTypes":["kd.bos.extplugin.ExtEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"event 事件参数，内含事件名和具体的参数值","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[{"attrs":{"value":"\"KingScriptEngine\""},"name":"kd.sdk.lifecycle.ReleaseResource"}],"comment":"关闭释放资源\n 增加注解：如有脚本插件，通知脚本引擎释放资源","constructor":false,"modifiers":"default","name":"release","paramNames":[],"paramTypes":[],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[],"throwExceptions":[]}],"name":"StdExtPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
