t":"注册一个集合属性 集合属性和复杂属性一样也是指向另外一个实体类型的引用，所不同的是集合属性表达主表与明细表的关系时候使用。\n 在数据库中，集合属性会保存在明细表中，为一对多的关系。主实体与集合属性的关联主键使用主实体的主键，即要求明细表的外键名字和主表主键名字相同。\n 如系统中的订单主表及明细表分录即使用集合属性来表示\n \n <pre>\n <code>\n      //构建一个订单\n      DynamicObjectType saleOrderType = new DynamicObjectType(\"SaleOrder\");\n      //定义SaleOrderID属性，并设置为主键\n      saleOrderType.RegisterSimpleProperty(\"SaleOrderID\", typeof(int), 0, false, new SimplePropertyAttribute(true));\n      //定义单据明细\n      DynamicObjectType saleOrderItemType = new DynamicObjectType(\"SaleOrderItem\");\n      saleOrderItemType.RegisterSimpleProperty(\"SaleOrderItemID\", typeof(int), 0, false, new SimplePropertyAttribute(true));\n      //产品\n      saleOrderItemType.RegisterSimpleProperty(\"ProductID\", typeof(int));\n      //注册集合属性\n      DynamicProperty ItemsProperty = saleOrderType.RegisterCollectionProperty(\"Items\", saleOrderItemType);\n      //集合属性的读取和设置  \n      DynamicObject obj = new DynamicObject(saleOrderType);\n      //添加数据 \n      IList list = (IList)ItemsProperty.GetValue(people);  //取得分录集合 \n      list.Add(ItemsProperty.CollectionItemPropertyType.CreateInstance()); //集合操作，添加数据\n      object aItem = list[0];\n      IDataEntityType aItemType = aItem.CollectionItemPropertyType;  //取到第一个分录\n      ((ISimpleProperty)aItemType.Properties[\"ProductID\"]).SetValue(items[0], 2);  //赋值\n      </code>\n </pre>","constructor":false,"modifiers":"public final","name":"registerCollectionProperty","paramNames":["property"],"paramTypes":["kd.bos.dataentity.metadata.dynamicobject.DynamicCollectionProperty"],"returnType":"kd.bos.dataentity.metadata.dynamicobject.DynamicCollectionProperty","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"name\n            属性的名称","name":"@param","ownerType":"METHOD"},{"comment":"itemDataEntityType\n            集合中元素的类型","name":"@param","ownerType":"METHOD"},{"comment":"collectionType\n            集合本省的属性类型，默认是typeof(DynamicObjectCollection)","name":"@param","ownerType":"METHOD"},{"comment":"attributes\n            自定义标记集合","name":"@param","ownerType":"METHOD"},{"comment":"新定义的属性","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"注册一个复杂属性 复杂属性指向另外一个实体类型的引用，以一个属性保存一个整体段信息。\n 如系统中常用的中繁英文三个字段则可整体定义为复杂属性，整个系统可共用这个类型。\n 注意的是数据库中复杂属性字段与主字段在同一个表中，对于保存到另一表中的情况，使用引用属性ReferenceAttribute.\n \n <pre>\n <code>\n     //构建一个订单\n     DynamicObjectType saleOrderType = new DynamicObjectType(\"SaleOrder\");\n     // 定义SaleOrderID属性，并设置为主键\n     saleOrderType.registerSimpleProperty(\"SaleOrderID\", typeof(int), 0, false, new SimplePropertyAttribute(true));\n     //注册复杂属性\n     DynamicObjectType cpxType = new DynamicObjectType(\"CPX\");\n     DynamicProperty TelProperty = cpxType.registerSimpleProperty(\"Tel\", typeof(string));\n     DynamicProperty cpxProperty = saleOrderType.registerComplexProperty(\"ComplexProperty\", cpxType); \n     //复杂属性的读取和设置\n     DynamicObject obj = new DynamicObject(saleOrderType);\n     DynamicObject cpxValue = (DynamicObject)cpxProperty.getValue(obj);\n     TelProperty.setValue(cpxValue, \"2008\"); \n     </code>\n </pre>","constructor":false,"modifiers":"public final","name":"registerComplexProperty","paramNames":["property"],"paramTypes":["kd.bos.dataentity.metadata.dynamicobject.DynamicComplexProperty"],"returnType":"kd.bos.dataentity.metadata.dynamicobject.DynamicComplexProperty","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"name\n            属性的名称","name":"@param","ownerType":"METHOD"},{"comment":"dataEntityType\n            注册的复杂属性返回类型","name":"@param","ownerType":"METHOD"},{"comment":"isReadonly\n            此属性是否只读","name":"@param","ownerType":"METHOD"},{"comment":"attributes\n            自定义标签集","name":"@param","ownerType":"METHOD"},{"comment":"新定义的属性定义","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"注册一个普通属性，此属性不参与ORM的分析过程 仅供内部使用，外部请使用RegisterSimpleProperty","constructor":false,"modifiers":"public final","name":"registerProperty","paramN
