</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Repeat a String <code> repeat</code> times to form a\n new String, with a String separator injected each time. </p>\n\n <pre>\n StringUtils.repeat(null, null, 2) = null\n StringUtils.repeat(null, \"x\", 2)  = null\n StringUtils.repeat(\"\", null, 0)   = \"\"\n StringUtils.repeat(\"\", \"\", 2)     = \"\"\n StringUtils.repeat(\"\", \"x\", 3)    = \"xxx\"\n StringUtils.repeat(\"?\", \", \", 3)  = \"?, ?, ?\"\n </pre>","constructor":false,"modifiers":"public static","name":"repeat","paramNames":["str","separator","repeat"],"paramTypes":["java.lang.String","java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str        the String to repeat, may be null","name":"@param","ownerType":"METHOD"},{"comment":"separator  the String to inject, may be null","name":"@param","ownerType":"METHOD"},{"comment":"repeat     number of times to repeat str, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"a new String consisting of the original String repeated,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Returns padding using the specified delimiter repeated\n to a given length.</p>\n\n <pre>\n StringUtils.repeat('e', 0)  = \"\"\n StringUtils.repeat('e', 3)  = \"eee\"\n StringUtils.repeat('e', -2) = \"\"\n </pre>\n\n <p>Note: this method doesn't not support padding with\n <a href=\"http://www.unicode.org/glossary/#supplementary_character\">Unicode Supplementary Characters</a>\n as they require a pair of <code> char</code>s to be represented.\n If you are needing to support full I18N of your applications\n consider using <a href='javascript:scrollToAnchor(\"repeat--\")'>int)</a> instead.\n </p>","constructor":false,"modifiers":"public static","name":"repeat","paramNames":["ch","repeat"],"paramTypes":["char","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"ch  character to repeat","name":"@param","ownerType":"METHOD"},{"comment":"repeat  number of times to repeat char, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"String with repeated character","name":"@return","ownerType":"METHOD"},{"comment":"#repeat(String, int)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Replaces all occurrences of a String within another String.</p>\n\n <p>A <code> null</code> reference passed to this method is a no-op.</p>\n\n <pre>\n StringUtils.replace(null, *, *)        = null\n StringUtils.replace(\"\", *, *)          = \"\"\n StringUtils.replace(\"any\", null, *)    = \"any\"\n StringUtils.replace(\"any\", *, null)    = \"any\"\n StringUtils.replace(\"any\", \"\", *)      = \"any\"\n StringUtils.replace(\"aba\", \"a\", null)  = \"aba\"\n StringUtils.replace(\"aba\", \"a\", \"\")    = \"b\"\n StringUtils.replace(\"aba\", \"a\", \"z\")   = \"zbz\"\n </pre>","constructor":false,"modifiers":"public static","name":"replace","paramNames":["text","searchString","replacement"],"paramTypes":["java.lang.String","java.lang.String","java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"text  text to search and replace in, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchString  the String to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"replacement  the String to replace it with, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the text with any replacements processed,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"},{"comment":"#replace(String text, String searchString, String replacement, int max)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Replaces a String with another String inside a larger String,\n for the first <code> max</code> values of the search String.</p>\n\n <p>A <code> null</code> reference passed to this method is a no-op.</p>\n\n <pre>\n StringUtils.replace(null, *, *, *)         = null\n StringUtils.replace(\"\", *, *, *)           = \"\"\n StringUtils.replace(\"any\", null, *, *)     = \"any\"\n StringUtils.replace(\"any\", *, null, *)     = \"any\"\n StringUtils.replace(\"any\", \"\", *, *)       = \"any\"\n StringUtils.replace(\"any\", *, *, 0)        = \"any\"\n StringUtils.replace(\"abaa\", \"a\", null, -1) = \"abaa\"\n StringUtils.replace(\"abaa\", \"a\", \"\", -1)   = \"b\"\n StringUtils.replace(\"abaa\", \"a\", \"z\", 0)   = \"abaa\"\n StringUtils.replace(\"abaa\", \"a\", \"z\", 1)   = \"zbaa\"\n StringUtils.replace(\"abaa\", \"a\", \"z\", 2)   = \"zbza\"\n StringUtils.replace(\"abaa\", \"a\", \"z\", -1)  = \"zbzz\"\n </pre>","constructor":false,"modifiers":"public static","name":"replace","paramNames":["text","searchString","replacement","max"],"paramTypes":["java.lang.String","java.lang.String","java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"text  text to search and replace in, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchString  the String to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"replacement  the String to replace it with, may be null","name":"@param","ownerType":"METHOD"},{"comment":"max  maximum number of values to replace, or <code> -1</code> if no maximum","name":"@param","ownerType":"METHOD"},{"comment":"the text with any replacements processed,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Replaces all occurrences of a character in a String with another.\n This is a null-safe version of <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#replace--'>char)</a>.</p>\n\n <p>A <code> null</code> string input returns <code> null</code>.\n An empty (\"\") string input returns an empty string.</p>\n\n <pre>\n StringUtils.replaceChars(null, *, *)        = null\n StringUtils.replaceChars(\"\", *, *)          = \"\"\n StringUtils.replaceChars(\"abcba\", 'b', 'y') = \"aycya\"\n StringUtils.replaceChars(\"abcba\", 'z', 'y') = \"abcba\"\n </pre>","constructor":false,"modifiers":"public static","name":"replaceChars","paramNames":["str","searchChar","replaceChar"],"paramTypes":["java.lang.String","char","char"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  String to replace characters in, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchChar  the character to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"replaceChar  the character to replace, may be null","name":"@param","ownerType":"METHOD"},{"comment":"modified String, <code> null</code> if null string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Replaces multiple characters in a String in one go.\n This method can also be used to delete characters.</p>\n\n <p>For example:<br>\n <code>replaceChars(&quot;hello&quot;, &quot;ho&quot;, &quot;jy&quot;) = jelly</code>.</p>\n\n <p>A <code> null</code> string input returns <code> null</code>.\n An empty (\"\") string input returns an empty string.\n A null or empty set of search characters returns the input string.</p>\n\n <p>The length of the search characters should normally equal the length\n of the replace characters.\n If the search characters is longer, then the extra search characters\n are deleted.\n If the search characters is shorter, then the extra replace characters\n are ignored.</p>\n\n <pre>\n StringUtils.replaceChars(null, *, *)           = null\n StringUtils.replaceChars(\"\", *, *)             = \"\"\n StringUtils.replaceChars(\"abc\", null, *)       = \"abc\"\n StringUtils.replaceChars(\"abc\", \"\", *)         = \"abc\"\n StringUtils.replaceChars(\"abc\", \"b\", null)     = \"ac\"\n StringUtils.replaceChars(\"abc\", \"b\", \"\")       = \"ac\"\n StringUtils.replaceChars(\"abcba\", \"bc\", \"yz\")  = \"ayzya\"\n StringUtils.replaceChars(\"abcba\", \"bc\", \"y\")   = \"ayya\"\n StringUtils.replaceChars(\"abcba\", \"bc\", \"yzx\") = \"ayzya\"\n </pre>","constructor":false,"modifiers":"public static","name":"replaceChars","paramNames":["str","searchChars","replaceChars"],"paramTypes":["java.lang.String","java.lang.String","java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  String to replace characters in, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchChars  a set of characters to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"replaceChars  a set of characters to replace, may be null","name":"@param","ownerType":"METHOD"},{"comment":"modified String, <code> null</code> if null string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>\n Replaces all occurrences of Strings within another String.\n </p>\n\n <p>\n A <code> null</code> reference passed to this method is a no-op, or if\n any \"search string\" or \"string to replace\" is null, that replace will be\n ignored. This will not repeat. For repeating replaces, call the\n overloaded method.\n </p>\n\n <pre>\n  StringUtils.replaceEach(null, *, *)        = null\n  StringUtils.replaceEach(\"\", *, *)          = \"\"\n  StringUtils.replaceEach(\"aba\", null, null) = \"aba\"\n  StringUtils.replaceEach(\"aba\", new String[0], null) = \"aba\"\n  StringUtils.replaceEach(\"aba\", null, new String[0]) = \"aba\"\n  StringUtils.replaceEach(\"aba\", new String[]{\"a\"}, null)  = \"aba\"\n  StringUtils.replaceEach(\"aba\", new String[]{\"a\"}, new String[]{\"\"})  = \"b\"\n  StringUtils.replaceEach(\"aba\", new String[]{null}, new String[]{\"a\"})  = \"aba\"\n  StringUtils.replaceEach(\"abcde\", new String[]{\"ab\", \"d\"}, new String[]{\"w\", \"t\"})  = \"wcte\"\n  (example of how it does not repeat)\n  StringUtils.replaceEach(\"abcde\", new String[]{\"ab\", \"d\"}, new String[]{\"d\", \"t\"})  = \"dcte\"\n </pre>","constructor":false,"modifiers":"public static","name":"replaceEach","paramNames":["text","searchList","replacementList"],"paramTypes":["java.lang.String","java.lang.String[]","java.lang.String[]"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"text\n            text to search and replace in, no-op if null","name":"@param","ownerType":"METHOD"},{"comment":"searchList\n            the Strings to search for, no-op if null","name":"@param","ownerType":"METHOD"},{"comment":"replacementList\n            the Strings to replace them with, no-op if null","name":"@param","ownerType":"METHOD"},{"comment":"the text with any replacements processed, <code> null</code> if\n         null String input","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException\n             if the lengths of the arrays are not the same (null is ok,\n             and/or size 0)","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>\n Replaces all occurrences of Strings within another String.\n </p>\n\n <p>\n A <code> null</code> reference passed to this method is a no-op, or if\n any \"search string\" or \"string to replace\" is null, that replace will be\n ignored.\n </p>\n\n <pre>\n  StringUtils.replaceEachRepeatedly(null, *, *) = null\n  StringUtils.replaceEachRepeatedly(\"\", *, *) = \"\"\n  StringUtils.replaceEachRepeatedly(\"aba\", null, null) = \"aba\"\n  StringUtils.replaceEachRepeatedly(\"aba\", new String[0], null) = \"aba\"\n  StringUtils.replaceEachRepeatedly(\"aba\", null, new String[0]) = \"aba\"\n  StringUtils.replaceEachRepeatedly(\"aba\", new String[]{\"a\"}, null) = \"aba\"\n  StringUtils.replaceEachRepeatedly(\"aba\", new String[]{\"a\"}, new String[]{\"\"}) = \"b\"\n  StringUtils.replaceEachRepeatedly(\"aba\", new String[]{null}, new String[]{\"a\"}) = \"aba\"\n  StringUtils.replaceEachRepeatedly(\"abcde\", new String[]{\"ab\", \"d\"}, new String[]{\"w\", \"t\"}) = \"wcte\"\n  (example of how it repeats)\n  StringUtils.replaceEachRepeatedly(\"abcde\", new String[]{\"ab\", \"d\"}, new String[]{\"d\", \"t\"}) = \"tcte\"\n  StringUtils.replaceEachRepeatedly(\"abcde\", new String[]{\"ab\", \"d\"}, new String[]{\"d\", \"ab\"}) = IllegalStateException\n </pre>","constructor":false,"modifiers":"public static","name":"replaceEachRepeatedly","paramNames":["text","searchList","replacementList"],"paramTypes":["java.lang.String","java.lang.String[]","java.lang.String[]"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"text\n            text to search and replace in, no-op if null","name":"@param","ownerType":"METHOD"},{"comment":"searchList\n            the Strings to search for, no-op if null","name":"@param","ownerType":"METHOD"},{"comment":"replacementList\n            the Strings to replace them with, no-op if null","name":"@param","ownerType":"METHOD"},{"comment":"the text with any replacements processed, <code> null</code> if\n         null String input","name":"@return","ownerType":"METHOD"},{"comment":"IllegalStateException\n             if the search is repeating and there is an endless loop due\n             to outputs of one being inputs to another","name":"@throws","ownerType":"METHOD"},{"comment":"IllegalArgumentException\n             if the lengths of the arrays are not the same (null is ok,\n             and/or size 0)","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Replaces a String with another String inside a larger String, once.</p>\n\n <p>A <code> null</code> reference passed to this method is a no-op.</p>\n\n <pre>\n StringUtils.replaceOnce(null, *, *)        = null\n StringUtils.replaceOnce(\"\", *, *)          = \"\"\n StringUtils.replaceOnce(\"any\", null, *)    = \"any\"\n StringUtils.replaceOnce(\"any\", *, null)    = \"any\"\n StringUtils.replaceOnce(\"any\", \"\", *)      = \"any\"\n StringUtils.replaceOnce(\"aba\", \"a\", null)  = \"aba\"\n StringUtils.replaceOnce(\"aba\", \"a\", \"\")    = \"ba\"\n StringUtils.replaceOnce(\"aba\", \"a\", \"z\")   = \"zba\"\n </pre>","constructor":false,"modifiers":"public static","name":"replaceOnce","paramNames":["text","searchString","replacement"],"paramTypes":["java.lang.String","java.lang.String","java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"text  text to search and replace in, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchString  the String to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"replacement  the String to replace with, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the text with any replacements processed,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"},{"comment":"#replace(String text, String searchString, String replacement, int max)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"Replaces each substring of the source String that matches the given regular expression with the given\n replacement using the <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=Pattern#DOTALL'>Pattern#DOTALL</a> option. DOTALL is also know as single-line mode in Perl. This call\n is also equivalent to:\n <ul>\n <li><code> source.replaceAll(&quot;(?s)&quot; + regex, replacement)</code></li>\n <li><code> Pattern.compile(regex, Pattern.DOTALL).matcher(source).replaceAll(replacement)</code></li>\n </ul>","constructor":false,"modifiers":"public static","name":"replacePattern","paramNames":["source","regex","replacement"],"paramTypes":["java.lang.String","java.lang.String","java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"source\n            the source string","name":"@param","ownerType":"METHOD"},{"comment":"regex\n            the regular expression to which this string is to be matched","name":"@param","ownerType":"METHOD"},{"comment":"replacement\n            the string to be substituted for each match","name":"@param","ownerType":"METHOD"},{"comment":"The resulting <code> String</code>","name":"@return","ownerType":"METHOD"},{"comment":"String#replaceAll(String, String)","name":"@see","ownerType":"METHOD"},{"comment":"Pattern#DOTALL","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Reverses a String as per <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=StringBuilder#reverse--'>StringBuilder#reverse()</a>.</p>\n\n <p>A <code> null</code> String returns <code> null</code>.</p>\n\n <pre>\n StringUtils.reverse(null)  = null\n StringUtils.reverse(\"\")    = \"\"\n StringUtils.reverse(\"bat\") = \"tab\"\n </pre>","constructor":false,"modifiers":"public static","name":"reverse","paramNames":["str"],"paramTypes":["java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to reverse, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the reversed String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Gets the rightmost <code> len</code> characters of a String.</p>\n\n <p>If <code> len</code> characters are not available, or the String\n is <code> null</code>, the String will be returned without an\n an exception. An empty String is returned if len is negative.</p>\n\n <pre>\n StringUtils.right(null, *)    = null\n StringUtils.right(*, -ve)     = \"\"\n StringUtils.right(\"\", *)      = \"\"\n StringUtils.right(\"abc\", 0)   = \"\"\n StringUtils.right(\"abc\", 2)   = \"bc\"\n StringUtils.right(\"abc\", 4)   = \"abc\"\n </pre>","constructor":false,"modifiers":"public static","name":"right","paramNames":["str","len"],"paramTypes":["java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to get the rightmost characters from, may be null","name":"@param","ownerType":"METHOD"},{"comment":"len  the length of the required String","name":"@param","ownerType":"METHOD"},{"comment":"the rightmost characters, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Right pad a String with spaces (' ').</p>\n\n <p>The String is padded to the size of <code> size</code>.</p>\n\n <pre>\n StringUtils.rightPad(null, *)   = null\n StringUtils.rightPad(\"\", 3)     = \"   \"\n StringUtils.rightPad(\"bat\", 3)  = \"bat\"\n StringUtils.rightPad(\"bat\", 5)  = \"bat  \"\n StringUtils.rightPad(\"bat\", 1)  = \"bat\"\n StringUtils.rightPad(\"bat\", -1) = \"bat\"\n </pre>","constructor":false,"modifiers":"public static","name":"rightPad","paramNames":["str","size"],"paramTypes":["java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to pad out, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the size to pad to","name":"@param","ownerType":"METHOD"},{"comment":"right padded String or original String if no padding is necessary,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Right pad a String with a specified character.</p>\n\n <p>The String is padded to the size of <code> size</code>.</p>\n\n <pre>\n StringUtils.rightPad(null, *, *)     = null\n StringUtils.rightPad(\"\", 3, 'z')     = \"zzz\"\n StringUtils.rightPad(\"bat\", 3, 'z')  = \"bat\"\n StringUtils.rightPad(\"bat\", 5, 'z')  = \"batzz\"\n StringUtils.rightPad(\"bat\", 1, 'z')  = \"bat\"\n StringUtils.rightPad(\"bat\", -1, 'z') = \"bat\"\n </pre>","constructor":false,"modifiers":"public static","name":"rightPad","paramNames":["str","size","padChar"],"paramTypes":["java.lang.String","int","char"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to pad out, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the size to pad to","name":"@param","ownerType":"METHOD"},{"comment":"padChar  the character to pad with","name":"@param","ownerType":"METHOD"},{"comment":"right padded String or original String if no padding is necessary,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Right pad a String with a specified String.</p>\n\n <p>The String is padded to the size of <code> size</code>.</p>\n\n <pre>\n StringUtils.rightPad(null, *, *)      = null\n StringUtils.rightPad(\"\", 3, \"z\")      = \"zzz\"\n StringUtils.rightPad(\"bat\", 3, \"yz\")  = \"bat\"\n StringUtils.rightPad(\"bat\", 5, \"yz\")  = \"batyz\"\n StringUtils.rightPad(\"bat\", 8, \"yz\")  = \"batyzyzy\"\n StringUtils.rightPad(\"bat\", 1, \"yz\")  = \"bat\"\n StringUtils.rightPad(\"bat\", -1, \"yz\") = \"bat\"\n StringUtils.rightPad(\"bat\", 5, null)  = \"bat  \"\n StringUtils.rightPad(\"bat\", 5, \"\")    = \"bat  \"\n </pre>","constructor":false,"modifiers":"public static","name":"rightPad","paramNames":["str","size","padStr"],"paramTypes":["java.lang.String","int","java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to pad out, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the size to pad to","name":"@param","ownerType":"METHOD"},{"comment":"padStr  the String to pad with, null or empty treated as single space","name":"@param","ownerType":"METHOD"},{"comment":"right padded String or original String if no padding is necessary,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits the provided text into an array, using whitespace as the\n separator.\n Whitespace is defined by <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=Character#isWhitespace--'>Character#isWhitespace(char)</a>.</p>\n\n <p>The separator is not included in the returned String array.\n Adjacent separators are treated as one separator.\n For more control over the split use the StrTokenizer class.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.</p>\n\n <pre>\n StringUtils.split(null)       = null\n StringUtils.split(\"\")         = []\n StringUtils.split(\"abc def\")  = [\"abc\", \"def\"]\n StringUtils.split(\"abc  def\") = [\"abc\", \"def\"]\n StringUtils.split(\" abc \")    = [\"abc\"]\n </pre>","constructor":false,"modifiers":"public static","name":"split","paramNames":["str"],"paramTypes":["java.lang.String"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to parse, may be null","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits the provided text into an array, separators specified.\n This is an alternative to using StringTokenizer.</p>\n\n <p>The separator is not included in the returned String array.\n Adjacent separators are treated as one separator.\n For more control over the split use the StrTokenizer class.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.\n A <code> null</code> separatorChars splits on whitespace.</p>\n\n <pre>\n StringUtils.split(null, *)         = null\n StringUtils.split(\"\", *)           = []\n StringUtils.split(\"abc def\", null) = [\"abc\", \"def\"]\n StringUtils.split(\"abc def\", \" \")  = [\"abc\", \"def\"]\n StringUtils.split(\"abc  def\", \" \") = [\"abc\", \"def\"]\n StringUtils.split(\"ab:cd:ef\", \":\") = [\"ab\", \"cd\", \"ef\"]\n </pre>","constructor":false,"modifiers":"public static","name":"split","paramNames":["str","separatorChars"],"paramTypes":["java.lang.String","java.lang.String"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to parse, may be null","name":"@param","ownerType":"METHOD"},{"comment":"separatorChars  the characters used as the delimiters,\n  <code> null</code> splits on whitespace","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits the provided text into an array with a maximum length,\n separators specified.</p>\n\n <p>The separator is not included in the returned String array.\n Adjacent separators are treated as one separator.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.\n A <code> null</code> separatorChars splits on whitespace.</p>\n\n <p>If more than <code> max</code> delimited substrings are found, the last\n returned string includes all characters after the first <code> max - 1</code>\n returned strings (including separator characters).</p>\n\n <pre>\n StringUtils.split(null, *, *)            = null\n StringUtils.split(\"\", *, *)              = []\n StringUtils.split(\"ab cd ef\", null, 0)   = [\"ab\", \"cd\", \"ef\"]\n StringUtils.split(\"ab   cd ef\", null, 0) = [\"ab\", \"cd\", \"ef\"]\n StringUtils.split(\"ab:cd:ef\", \":\", 0)    = [\"ab\", \"cd\", \"ef\"]\n StringUtils.split(\"ab:cd:ef\", \":\", 2)    = [\"ab\", \"cd:ef\"]\n </pre>","constructor":false,"modifiers":"public static","name":"split","paramNames":["str","separatorChars","max"],"paramTypes":["java.lang.String","java.lang.String","int"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to parse, may be null","name":"@param","ownerType":"METHOD"},{"comment":"separatorChars  the characters used as the delimiters,\n  <code> null</code> splits on whitespace","name":"@param","ownerType":"METHOD"},{"comment":"max  the maximum number of elements to include in the\n  array. A zero or negative value implies no limit","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits a String by Character type as returned by\n <code> java.lang.Character.getType(char)</code>. Groups of contiguous\n characters of the same type are returned as complete tokens.\n <pre>\n StringUtils.splitByCharacterType(null)         = null\n StringUtils.splitByCharacterType(\"\")           = []\n StringUtils.splitByCharacterType(\"ab de fg\")   = [\"ab\", \" \", \"de\", \" \", \"fg\"]\n StringUtils.splitByCharacterType(\"ab   de fg\") = [\"ab\", \"   \", \"de\", \" \", \"fg\"]\n StringUtils.splitByCharacterType(\"ab:cd:ef\")   = [\"ab\", \":\", \"cd\", \":\", \"ef\"]\n StringUtils.splitByCharacterType(\"number5\")    = [\"number\", \"5\"]\n StringUtils.splitByCharacterType(\"fooBar\")     = [\"foo\", \"B\", \"ar\"]\n StringUtils.splitByCharacterType(\"foo200Bar\")  = [\"foo\", \"200\", \"B\", \"ar\"]\n StringUtils.splitByCharacterType(\"ASFRules\")   = [\"ASFR\", \"ules\"]\n </pre>","constructor":false,"modifiers":"public static","name":"splitByCharacterType","paramNames":["str"],"paramTypes":["java.lang.String"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str the String to split, may be <code> null</code>","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits a String by Character type as returned by\n <code> java.lang.Character.getType(char)</code>. Groups of contiguous\n characters of the same type are returned as complete tokens, with the\n following exception: the character of type\n <code> Character.UPPERCASE_LETTER</code>, if any, immediately\n preceding a token of type <code> Character.LOWERCASE_LETTER</code>\n will belong to the following token rather than to the preceding, if any,\n <code> Character.UPPERCASE_LETTER</code> token.\n <pre>\n StringUtils.splitByCharacterTypeCamelCase(null)         = null\n StringUtils.splitByCharacterTypeCamelCase(\"\")           = []\n StringUtils.splitByCharacterTypeCamelCase(\"ab de fg\")   = [\"ab\", \" \", \"de\", \" \", \"fg\"]\n StringUtils.splitByCharacterTypeCamelCase(\"ab   de fg\") = [\"ab\", \"   \", \"de\", \" \", \"fg\"]\n StringUtils.splitByCharacterTypeCamelCase(\"ab:cd:ef\")   = [\"ab\", \":\", \"cd\", \":\", \"ef\"]\n StringUtils.splitByCharacterTypeCamelCase(\"number5\")    = [\"number\", \"5\"]\n StringUtils.splitByCharacterTypeCamelCase(\"fooBar\")     = [\"foo\", \"Bar\"]\n StringUtils.splitByCharacterTypeCamelCase(\"foo200Bar\")  = [\"foo\", \"200\", \"Bar\"]\n StringUtils.splitByCharacterTypeCamelCase(\"ASFRules\")   = [\"ASF\", \"Rules\"]\n </pre>","constructor":false,"modifiers":"public static","name":"splitByCharacterTypeCamelCase","paramNames":["str"],"paramTypes":["java.lang.String"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str the String to split, may be <code> null</code>","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits the provided text into an array, using whitespace as the\n separator, preserving all tokens, including empty tokens created by\n adjacent separators. This is an alternative to using StringTokenizer.\n Whitespace is defined by <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=Character#isWhitespace--'>Character#isWhitespace(char)</a>.</p>\n\n <p>The separator is not included in the returned String array.\n Adjacent separators are treated as separators for empty tokens.\n For more control over the split use the StrTokenizer class.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.</p>\n\n <pre>\n StringUtils.splitPreserveAllTokens(null)       = null\n StringUtils.splitPreserveAllTokens(\"\")         = []\n StringUtils.splitPreserveAllTokens(\"abc def\")  = [\"abc\", \"def\"]\n StringUtils.splitPreserveAllTokens(\"abc  def\") = [\"abc\", \"\", \"def\"]\n StringUtils.splitPreserveAllTokens(\" abc \")    = [\"\", \"abc\", \"\"]\n </pre>","constructor":false,"modifiers":"public static","name":"splitPreserveAllTokens","paramNames":["str"],"paramTypes":["java.lang.String"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to parse, may be <code> null</code>","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits the provided text into an array, separators specified,\n preserving all tokens, including empty tokens created by adjacent\n separators. This is an alternative to using StringTokenizer.</p>\n\n <p>The separator is not included in the returned String array.\n Adjacent separators are treated as separators for empty tokens.\n For more control over the split use the StrTokenizer class.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.\n A <code> null</code> separatorChars splits on whitespace.</p>\n\n <pre>\n StringUtils.splitPreserveAllTokens(null, *)           = null\n StringUtils.splitPreserveAllTokens(\"\", *)             = []\n StringUtils.splitPreserveAllTokens(\"abc def\", null)   = [\"abc\", \"def\"]\n StringUtils.splitPreserveAllTokens(\"abc def\", \" \")    = [\"abc\", \"def\"]\n StringUtils.splitPreserveAllTokens(\"abc  def\", \" \")   = [\"abc\", \"\", def\"]\n StringUtils.splitPreserveAllTokens(\"ab:cd:ef\", \":\")   = [\"ab\", \"cd\", \"ef\"]\n StringUtils.splitPreserveAllTokens(\"ab:cd:ef:\", \":\")  = [\"ab\", \"cd\", \"ef\", \"\"]\n StringUtils.splitPreserveAllTokens(\"ab:cd:ef::\", \":\") = [\"ab\", \"cd\", \"ef\", \"\", \"\"]\n StringUtils.splitPreserveAllTokens(\"ab::cd:ef\", \":\")  = [\"ab\", \"\", cd\", \"ef\"]\n StringUtils.splitPreserveAllTokens(\":cd:ef\", \":\")     = [\"\", cd\", \"ef\"]\n StringUtils.splitPreserveAllTokens(\"::cd:ef\", \":\")    = [\"\", \"\", cd\", \"ef\"]\n StringUtils.splitPreserveAllTokens(\":cd:ef:\", \":\")    = [\"\", cd\", \"ef\", \"\"]\n </pre>","constructor":false,"modifiers":"public static","name":"splitPreserveAllTokens","paramNames":["str","separatorChars"],"paramTypes":["java.lang.String","java.lang.String"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to parse, may be <code> null</code>","name":"@param","ownerType":"METHOD"},{"comment":"separatorChars  the characters used as the delimiters,\n  <code> null</code> splits on whitespace","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Splits the provided text into an array with a maximum length,\n separators specified, preserving all tokens, including empty tokens\n created by adjacent separators.</p>\n\n <p>The separator is not included in the returned String array.\n Adjacent separators are treated as separators for empty tokens.\n Adjacent separators are treated as one separator.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.\n A <code> null</code> separatorChars splits on whitespace.</p>\n\n <p>If more than <code> max</code> delimited substrings are found, the last\n returned string includes all characters after the first <code> max - 1</code>\n returned strings (including separator characters).</p>\n\n <pre>\n StringUtils.splitPreserveAllTokens(null, *, *)            = null\n StringUtils.splitPreserveAllTokens(\"\", *, *)              = []\n StringUtils.splitPreserveAllTokens(\"ab de fg\", null, 0)   = [\"ab\", \"cd\", \"ef\"]\n StringUtils.splitPreserveAllTokens(\"ab   de fg\", null, 0) = [\"ab\", \"cd\", \"ef\"]\n StringUtils.splitPreserveAllTokens(\"ab:cd:ef\", \":\", 0)    = [\"ab\", \"cd\", \"ef\"]\n StringUtils.splitPreserveAllTokens(\"ab:cd:ef\", \":\", 2)    = [\"ab\", \"cd:ef\"]\n StringUtils.splitPreserveAllTokens(\"ab   de fg\", null, 2) = [\"ab\", \"  de fg\"]\n StringUtils.splitPreserveAllTokens(\"ab   de fg\", null, 3) = [\"ab\", \"\", \" de fg\"]\n StringUtils.splitPreserveAllTokens(\"ab   de fg\", null, 4) = [\"ab\", \"\", \"\", \"de fg\"]\n </pre>","constructor":false,"modifiers":"public static","name":"splitPreserveAllTokens","paramNames":["str","separatorChars","max"],"paramTypes":["java.lang.String","java.lang.String","int"],"returnType":"java.lang.String[]","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to parse, may be <code> null</code>","name":"@param","ownerType":"METHOD"},{"comment":"separatorChars  the characters used as the delimiters,\n  <code> null</code> splits on whitespace","name":"@param","ownerType":"METHOD"},{"comment":"max  the maximum number of elements to include in the\n  array. A zero or negative value implies no limit","name":"@param","ownerType":"METHOD"},{"comment":"an array of parsed Strings, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Check if a CharSequence starts with a specified prefix.</p>\n\n <p><code> null</code>s are handled without exceptions. Two <code> null</code>\n references are considered to be equal. The comparison is case sensitive.</p>\n\n <pre>\n StringUtils.startsWith(null, null)      = true\n StringUtils.startsWith(null, \"abc\")     = false\n StringUtils.startsWith(\"abcdef\", null)  = false\n StringUtils.startsWith(\"abcdef\", \"abc\") = true\n StringUtils.startsWith(\"ABCDEF\", \"abc\") = false\n </pre>","constructor":false,"modifiers":"public static","name":"startsWith","paramNames":["str","prefix"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"prefix the prefix to find, may be null","name":"@param","ownerType":"METHOD"},{"comment":"<code> true</code> if the CharSequence starts with the prefix, case sensitive, or\n  both <code> null</code>","name":"@return","ownerType":"METHOD"},{"comment":"java.lang.String#startsWith(String)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Check if a CharSequence starts with any of an array of specified strings.</p>\n\n <pre>\n StringUtils.startsWithAny(null, null)      = false\n StringUtils.startsWithAny(null, new String[] {\"abc\"})  = false\n StringUtils.startsWithAny(\"abcxyz\", null)     = false\n StringUtils.startsWithAny(\"abcxyz\", new String[] {\"\"}) = false\n StringUtils.startsWithAny(\"abcxyz\", new String[] {\"abc\"}) = true\n StringUtils.startsWithAny(\"abcxyz\", new String[] {null, \"xyz\", \"abc\"}) = true\n </pre>","constructor":false,"modifiers":"public static","name":"startsWithAny","paramNames":["string","searchStrings"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence[]"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"string  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchStrings the CharSequences to find, may be null or empty","name":"@param","ownerType":"METHOD"},{"comment":"<code> true</code> if the CharSequence starts with any of the the prefixes, case insensitive, or\n  both <code> null</code>","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Case insensitive check if a CharSequence starts with a specified prefix.</p>\n\n <p><code> null</code>s are handled without exceptions. Two <code> null</code>\n references are considered to be equal. The comparison is case insensitive.</p>\n\n <pre>\n StringUtils.startsWithIgnoreCase(null, null)      = true\n StringUtils.startsWithIgnoreCase(null, \"abc\")     = false\n StringUtils.startsWithIgnoreCase(\"abcdef\", null)  = false\n StringUtils.startsWithIgnoreCase(\"abcdef\", \"abc\") = true\n StringUtils.startsWithIgnoreCase(\"ABCDEF\", \"abc\") = true\n </pre>","constructor":false,"modifiers":"public static","name":"startsWithIgnoreCase","paramNames":["str","prefix"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"prefix the prefix to find, may be null","name":"@param","ownerType":"METHOD"},{"comment":"<code> true</code> if the CharSequence starts with the prefix, case insensitive, or\n  both <code> null</code>","name":"@return","ownerType":"METHOD"},{"comment":"java.lang.String#startsWith(String)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Strips whitespace from the start and end of a String.</p>\n\n <p>This is similar to <a href='javascript:scrollToAnchor(\"trim--\")'>#trim(String)</a> but removes whitespace.\n Whitespace is defined by <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=Character#isWhitespace--'>Character#isWhitespace(char)</a>.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.</p>\n\n <pre>\n StringUtils.strip(null)     = null\n StringUtils.strip(\"\")       = \"\"\n StringUtils.strip(\"   \")    = \"\"\n StringUtils.strip(\"abc\")    = \"abc\"\n StringUtils.strip(\"  abc\")  = \"abc\"\n StringUtils.strip(\"abc  \")  = \"abc\"\n StringUtils.strip(\" abc \")  = \"abc\"\n StringUtils.strip(\" ab c \") = \"ab c\"\n </pre>","constructor":false,"modifiers":"public static","name":"strip","paramNames":["str"],"paramTypes":["java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to remove whitespace from, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the stripped String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Strips any of a set of characters from the start and end of a String.\n This is similar to <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#trim--'>String#trim()</a> but allows the characters\n to be stripped to be controlled.</p>\n\n <p>A <code> null</code> input String returns <code> null</code>.\n An empty string (\"\") input returns the empty string.</p>\n\n <p>If the stripChars String is <code> null</code>, whitespace is\n stripped as defined by <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=Character#isWhitespace--'>Character#isWhitespace(char)</a>.\n Alternatively use <a href='javascript:scrollToAnchor(\"strip--\")'>#strip(String)</a>.</p>\n\n <pre>\n StringUtils.strip(null, *)          = null\n StringUtils.strip(\"\", *)            = \"\"\n StringUtils.strip(\"abc\", null)      = \"abc\"\n StringUtils.strip(\"  abc\", null)    = \"abc\"\n StringUtils.strip(
