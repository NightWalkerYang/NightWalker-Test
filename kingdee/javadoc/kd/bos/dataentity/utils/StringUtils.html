<!DOCTYPE html><html><head><meta charset="utf-8"><title>StringUtils</title><script type="text/javascript" src="../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{},"name":"KSObject"},{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"}],"comment":"<p>Operations on <a href='?nav=class&package=java.lang&name=String'>java.lang.String</a> that are\n <code> null</code> safe.</p>\n\n <ul>\n  <li><b>IsEmpty/IsBlank</b>\n      - checks if a String contains text</li>\n  <li><b>Trim/Strip</b>\n      - removes leading and trailing whitespace</li>\n  <li><b>Equals</b>\n      - compares two strings null-safe</li>\n  <li><b>startsWith</b>\n      - check if a String starts with a prefix null-safe</li>\n  <li><b>endsWith</b>\n      - check if a String ends with a suffix null-safe</li>\n  <li><b>IndexOf/LastIndexOf/Contains</b>\n      - null-safe index-of checks\n  <li><b>IndexOfAny/LastIndexOfAny/IndexOfAnyBut/LastIndexOfAnyBut</b>\n      - index-of any of a set of Strings</li>\n  <li><b>ContainsOnly/ContainsNone/ContainsAny</b>\n      - does String contains only/none/any of these characters</li>\n  <li><b>Substring/Left/Right/Mid</b>\n      - null-safe substring extractions</li>\n  <li><b>SubstringBefore/SubstringAfter/SubstringBetween</b>\n      - substring extraction relative to other strings</li>\n  <li><b>Split/Join</b>\n      - splits a String into an array of substrings and vice versa</li>\n  <li><b>Remove/Delete</b>\n      - removes part of a String</li>\n  <li><b>Replace/Overlay</b>\n      - Searches a String and replaces one String with another</li>\n  <li><b>Chomp/Chop</b>\n      - removes the last part of a String</li>\n  <li><b>AppendIfMissing</b>\n      - appends a suffix to the end of the String if not present</li>\n  <li><b>PrependIfMissing</b>\n      - prepends a prefix to the start of the String if not present</li>\n  <li><b>LeftPad/RightPad/Center/Repeat</b>\n      - pads a String</li>\n  <li><b>UpperCase/LowerCase/SwapCase/Capitalize/Uncapitalize</b>\n      - changes the case of a String</li>\n  <li><b>CountMatches</b>\n      - counts the number of occurrences of one String in another</li>\n  <li><b>IsAlpha/IsNumeric/IsWhitespace/IsAsciiPrintable</b>\n      - checks the characters in a String</li>\n  <li><b>DefaultString</b>\n      - protects against a null input String</li>\n  <li><b>Reverse/ReverseDelimited</b>\n      - reverses a String</li>\n  <li><b>Abbreviate</b>\n      - abbreviates a string using ellipsis</li>\n  <li><b>Difference</b>\n      - compares Strings and reports on their differences</li>\n  <li><b>LevenshteinDistance</b>\n      - the number of changes needed to change one String into another</li>\n </ul>\n\n <p>The <code> StringUtils</code> class defines certain words related to\n String handling.</p>\n\n <ul>\n  <li>null - <code> null</code></li>\n  <li>empty - a zero-length string (<code> \"\"</code>)</li>\n  <li>space - the space character (<code> ' '</code>, char 32)</li>\n  <li>whitespace - the characters defined by <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=Character#isWhitespace--'>Character#isWhitespace(char)</a></li>\n  <li>trim - the characters &lt;= 32 as in <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#trim--'>String#trim()</a></li>\n </ul>\n\n <p><code> StringUtils</code> handles <code> null</code> input Strings quietly.\n That is to say that a <code> null</code> input will return <code> null</code>.\n Where a <code> boolean</code> or <code> int</code> is being returned\n details vary by method.</p>\n\n <p>A side effect of the <code> null</code> handling is that a\n <code> NullPointerException</code> should be considered a bug in\n <code> StringUtils</code>.</p>\n\n <p>Methods in this class give sample code to explain their operation.\n The symbol <code> *</code> is used to indicate any input including <code> null</code>.</p>\n\n <p>#ThreadSafe#</p>","commented":176,"declare":"public class StringUtils","fields":[{"annotations":[],"comment":"A String for carriage return CR (\"\\r\").","constantValueExpression":"\"\\r\"","modifiers":"public static final","name":"CR","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"<a href=\"http://docs.oracle.com/javase/specs/jls/se7/html/jls-3.html#jls-3.10.6\">JLF: Escape Sequences\n      for Character and String Literals</a>","name":"@see","ownerType":"FIELD"}],"type":"java.lang.String"},{"annotations":[],"comment":"The empty String <code> \"\"</code>.","constantValueExpression":"\"\"","modifiers":"public static final","name":"EMPTY","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"java.lang.String"},{"annotations":[],"comment":"Represents a failed index search.","constantValueExpression":"-1","modifiers":"public static final","name":"INDEX_NOT_FOUND","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"int"},{"annotations":[],"comment":"A String for linefeed LF (\"\\n\").","constantValueExpression":"\"\\n\"","modifiers":"public static final","name":"LF","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"<a href=\"http://docs.oracle.com/javase/specs/jls/se7/html/jls-3.html#jls-3.10.6\">JLF: Escape Sequences\n      for Character and String Literals</a>","name":"@see","ownerType":"FIELD"}],"type":"java.lang.String"},{"annotations":[],"comment":"A String for a space character.","constantValueExpression":"\" \"","modifiers":"public static final","name":"SPACE","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"java.lang.String"}],"interfaces":[],"isDeprecated":false,"isPlugin":false,"isService":false,"methods":[{"annotations":[],"comment":"<p><code> StringUtils</code> instances should NOT be constructed in\n standard programming. Instead, the class should be used as\n <code> StringUtils.trim(\" foo \");</code>.</p>\n\n <p>This constructor is public to permit tools that require a JavaBean\n instance to operate.</p>","constructor":true,"modifiers":"public","name":"StringUtils","paramNames":[],"paramTypes":[],"scriptDeprecated":false,"sdkInternal":false,"tags":[],"throwExceptions":[]},{"annotations":[],"comment":"<p>Abbreviates a String using ellipses. This will turn\n \"Now is the time for all good men\" into \"Now is the time for...\"</p>\n\n <p>Specifically:</p>\n <ul>\n   <li>If the number of characters in <code> str</code> is less than or equal to \n       <code> maxWidth</code>, return <code> str</code>.</li>\n   <li>Else abbreviate it to <code> (substring(str, 0, max-3) + \"...\")</code>.</li>\n   <li>If <code> maxWidth</code> is less than <code> 4</code>, throw an\n       <code> IllegalArgumentException</code>.</li>\n   <li>In no case will it return a String of length greater than\n       <code> maxWidth</code>.</li>\n </ul>\n\n <pre>\n StringUtils.abbreviate(null, *)      = null\n StringUtils.abbreviate(\"\", 4)        = \"\"\n StringUtils.abbreviate(\"abcdefg\", 6) = \"abc...\"\n StringUtils.abbreviate(\"abcdefg\", 7) = \"abcdefg\"\n StringUtils.abbreviate(\"abcdefg\", 8) = \"abcdefg\"\n StringUtils.abbreviate(\"abcdefg\", 4) = \"a...\"\n StringUtils.abbreviate(\"abcdefg\", 3) = IllegalArgumentException\n </pre>","constructor":false,"modifiers":"public static","name":"abbreviate","paramNames":["str","maxWidth"],"paramTypes":["java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"maxWidth  maximum length of result String, must be at least 4","name":"@param","ownerType":"METHOD"},{"comment":"abbreviated String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException if the width is too small","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Abbreviates a String using ellipses. This will turn\n \"Now is the time for all good men\" into \"...is the time for...\"</p>\n\n <p>Works like <code> abbreviate(String, int)</code>, but allows you to specify\n a \"left edge\" offset.  Note that this left edge is not necessarily going to\n be the leftmost character in the result, or the first character following the\n ellipses, but it will appear somewhere in the result.\n\n <p>In no case will it return a String of length greater than\n <code> maxWidth</code>.</p>\n\n <pre>\n StringUtils.abbreviate(null, *, *)                = null\n StringUtils.abbreviate(\"\", 0, 4)                  = \"\"\n StringUtils.abbreviate(\"abcdefghijklmno\", -1, 10) = \"abcdefg...\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 0, 10)  = \"abcdefg...\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 1, 10)  = \"abcdefg...\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 4, 10)  = \"abcdefg...\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 5, 10)  = \"...fghi...\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 6, 10)  = \"...ghij...\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 8, 10)  = \"...ijklmno\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 10, 10) = \"...ijklmno\"\n StringUtils.abbreviate(\"abcdefghijklmno\", 12, 10) = \"...ijklmno\"\n StringUtils.abbreviate(\"abcdefghij\", 0, 3)        = IllegalArgumentException\n StringUtils.abbreviate(\"abcdefghij\", 5, 6)        = IllegalArgumentException\n </pre>","constructor":false,"modifiers":"public static","name":"abbreviate","paramNames":["str","offset","maxWidth"],"paramTypes":["java.lang.String","int","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"offset  left edge of source String","name":"@param","ownerType":"METHOD"},{"comment":"maxWidth  maximum length of result String, must be at least 4","name":"@param","ownerType":"METHOD"},{"comment":"abbreviated String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException if the width is too small","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Abbreviates a String to the length passed, replacing the middle characters with the supplied\n replacement String.</p>\n\n <p>This abbreviation only occurs if the following criteria is met:</p>\n <ul>\n <li>Neither the String for abbreviation nor the replacement String are null or empty </li>\n <li>The length to truncate to is less than the length of the supplied String</li>\n <li>The length to truncate to is greater than 0</li>\n <li>The abbreviated String will have enough room for the length supplied replacement String\n and the first and last characters of the supplied String for abbreviation</li>\n </ul>\n <p>Otherwise, the returned String will be the same as the supplied String for abbreviation.\n </p>\n\n <pre>\n StringUtils.abbreviateMiddle(null, null, 0)      = null\n StringUtils.abbreviateMiddle(\"abc\", null, 0)      = \"abc\"\n StringUtils.abbreviateMiddle(\"abc\", \".\", 0)      = \"abc\"\n StringUtils.abbreviateMiddle(\"abc\", \".\", 3)      = \"abc\"\n StringUtils.abbreviateMiddle(\"abcdef\", \".\", 4)     = \"ab.f\"\n </pre>","constructor":false,"modifiers":"public static","name":"abbreviateMiddle","paramNames":["str","middle","length"],"paramTypes":["java.lang.String","java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to abbreviate, may be null","name":"@param","ownerType":"METHOD"},{"comment":"middle the String to replace the middle characters with, may be null","name":"@param","ownerType":"METHOD"},{"comment":"length the length to abbreviate <code> str</code> to.","name":"@param","ownerType":"METHOD"},{"comment":"the abbreviated String if the above criteria is met, or the original String supplied for abbreviation.","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"Appends the suffix to the end of the string if the string does not\n already end with any the suffixes.\n\n <pre>\n StringUtils.appendIfMissing(null, null) = null\n StringUtils.appendIfMissing(\"abc\", null) = \"abc\"\n StringUtils.appendIfMissing(\"\", \"xyz\") = \"xyz\"\n StringUtils.appendIfMissing(\"abc\", \"xyz\") = \"abcxyz\"\n StringUtils.appendIfMissing(\"abcxyz\", \"xyz\") = \"abcxyz\"\n StringUtils.appendIfMissing(\"abcXYZ\", \"xyz\") = \"abcXYZxyz\"\n </pre>\n <p>With additional suffixes,</p>\n <pre>\n StringUtils.appendIfMissing(null, null, null) = null\n StringUtils.appendIfMissing(\"abc\", null, null) = \"abc\"\n StringUtils.appendIfMissing(\"\", \"xyz\", null) = \"xyz\"\n StringUtils.appendIfMissing(\"abc\", \"xyz\", new CharSequence[]{null}) = \"abcxyz\"\n StringUtils.appendIfMissing(\"abc\", \"xyz\", \"\") = \"abc\"\n StringUtils.appendIfMissing(\"abc\", \"xyz\", \"mno\") = \"abcxyz\"\n StringUtils.appendIfMissing(\"abcxyz\", \"xyz\", \"mno\") = \"abcxyz\"\n StringUtils.appendIfMissing(\"abcmno\", \"xyz\", \"mno\") = \"abcmno\"\n StringUtils.appendIfMissing(\"abcXYZ\", \"xyz\", \"mno\") = \"abcXYZxyz\"\n StringUtils.appendIfMissing(\"abcMNO\", \"xyz\", \"mno\") = \"abcMNOxyz\"\n </pre>","constructor":false,"modifiers":"public static","name":"appendIfMissing","paramNames":["str","suffix","suffixes"],"paramTypes":["java.lang.String","java.lang.CharSequence","java.lang.CharSequence[]"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str The string.","name":"@param","ownerType":"METHOD"},{"comment":"suffix The suffix to append to the end of the string.","name":"@param","ownerType":"METHOD"},{"comment":"suffixes Additional suffixes that are valid terminators.","name":"@param","ownerType":"METHOD"},{"comment":"A new String if suffix was appened, the same string otherwise.","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"Appends the suffix to the end of the string if the string does not\n already end, case insensitive, with any of the suffixes.\n\n <pre>\n StringUtils.appendIfMissingIgnoreCase(null, null) = null\n StringUtils.appendIfMissingIgnoreCase(\"abc\", null) = \"abc\"\n StringUtils.appendIfMissingIgnoreCase(\"\", \"xyz\") = \"xyz\"\n StringUtils.appendIfMissingIgnoreCase(\"abc\", \"xyz\") = \"abcxyz\"\n StringUtils.appendIfMissingIgnoreCase(\"abcxyz\", \"xyz\") = \"abcxyz\"\n StringUtils.appendIfMissingIgnoreCase(\"abcXYZ\", \"xyz\") = \"abcXYZ\"\n </pre>\n <p>With additional suffixes,</p>\n <pre>\n StringUtils.appendIfMissingIgnoreCase(null, null, null) = null\n StringUtils.appendIfMissingIgnoreCase(\"abc\", null, null) = \"abc\"\n StringUtils.appendIfMissingIgnoreCase(\"\", \"xyz\", null) = \"xyz\"\n StringUtils.appendIfMissingIgnoreCase(\"abc\", \"xyz\", new CharSequence[]{null}) = \"abcxyz\"\n StringUtils.appendIfMissingIgnoreCase(\"abc\", \"xyz\", \"\") = \"abc\"\n StringUtils.appendIfMissingIgnoreCase(\"abc\", \"xyz\", \"mno\") = \"axyz\"\n StringUtils.appendIfMissingIgnoreCase(\"abcxyz\", \"xyz\", \"mno\") = \"abcxyz\"\n StringUtils.appendIfMissingIgnoreCase(\"abcmno\", \"xyz\", \"mno\") = \"abcmno\"\n StringUtils.appendIfMissingIgnoreCase(\"abcXYZ\", \"xyz\", \"mno\") = \"abcXYZ\"\n StringUtils.appendIfMissingIgnoreCase(\"abcMNO\", \"xyz\", \"mno\") = \"abcMNO\"\n </pre>","constructor":false,"modifiers":"public static","name":"appendIfMissingIgnoreCase","paramNames":["str","suffix","suffixes"],"paramTypes":["java.lang.String","java.lang.CharSequence","java.lang.CharSequence[]"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str The string.","name":"@param","ownerType":"METHOD"},{"comment":"suffix The suffix to append to the end of the string.","name":"@param","ownerType":"METHOD"},{"comment":"suffixes Additional suffixes that are valid terminators.","name":"@param","ownerType":"METHOD"},{"comment":"A new String if suffix was appened, the same string otherwise.","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Capitalizes a String changing the first letter to title case as\n per <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=Character#toTitleCase--'>Character#toTitleCase(char)</a>. No other letters are changed.</p>\n\n <p>For a word based algorithm, see <a href='?nav=class&package=org.apache.commons.lang3.text&name=WordUtils#capitalize--'>org.apache.commons.lang3.text.WordUtils#capitalize(String)</a>.\n A <code> null</code> input String returns <code> null</code>.</p>\n\n <pre>\n StringUtils.capitalize(null)  = null\n StringUtils.capitalize(\"\")    = \"\"\n StringUtils.capitalize(\"cat\") = \"Cat\"\n StringUtils.capitalize(\"cAt\") = \"CAt\"\n </pre>","constructor":false,"modifiers":"public static","name":"capitalize","paramNames":["str"],"paramTypes":["java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str the String to capitalize, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the capitalized String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"},{"comment":"org.apache.commons.lang3.text.WordUtils#capitalize(String)","name":"@see","ownerType":"METHOD"},{"comment":"#uncapitalize(String)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Centers a String in a larger String of size <code> size</code>\n using the space character (' ').</p>\n\n <p>If the size is less than the String length, the String is returned.\n A <code> null</code> String returns <code> null</code>.\n A negative size is treated as zero.</p>\n\n <p>Equivalent to <code> center(str, size, \" \")</code>.</p>\n\n <pre>\n StringUtils.center(null, *)   = null\n StringUtils.center(\"\", 4)     = \"    \"\n StringUtils.center(\"ab\", -1)  = \"ab\"\n StringUtils.center(\"ab\", 4)   = \" ab \"\n StringUtils.center(\"abcd\", 2) = \"abcd\"\n StringUtils.center(\"a\", 4)    = \" a  \"\n </pre>","constructor":false,"modifiers":"public static","name":"center","paramNames":["str","size"],"paramTypes":["java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to center, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the int size of new String, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"centered String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Centers a String in a larger String of size <code> size</code>.\n Uses a supplied character as the value to pad the String with.</p>\n\n <p>If the size is less than the String length, the String is returned.\n A <code> null</code> String returns <code> null</code>.\n A negative size is treated as zero.</p>\n\n <pre>\n StringUtils.center(null, *, *)     = null\n StringUtils.center(\"\", 4, ' ')     = \"    \"\n StringUtils.center(\"ab\", -1, ' ')  = \"ab\"\n StringUtils.center(\"ab\", 4, ' ')   = \" ab \"\n StringUtils.center(\"abcd\", 2, ' ') = \"abcd\"\n StringUtils.center(\"a\", 4, ' ')    = \" a  \"\n StringUtils.center(\"a\", 4, 'y')    = \"yayy\"\n </pre>","constructor":false,"modifiers":"public static","name":"center","paramNames":["str","size","padChar"],"paramTypes":["java.lang.String","int","char"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to center, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the int size of new String, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"padChar  the character to pad the new String with","name":"@param","ownerType":"METHOD"},{"comment":"centered String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Centers a String in a larger String of size <code> size</code>.\n Uses a supplied String as the value to pad the String with.</p>\n\n <p>If the size is less than the String length, the String is returned.\n A <code> null</code> String returns <code> null</code>.\n A negative size is treated as zero.</p>\n\n <pre>\n StringUtils.center(null, *, *)     = null\n StringUtils.center(\"\", 4, \" \")     = \"    \"\n StringUtils.center(\"ab\", -1, \" \")  = \"ab\"\n StringUtils.center(\"ab\", 4, \" \")   = \" ab \"\n StringUtils.center(\"abcd\", 2, \" \") = \"abcd\"\n StringUtils.center(\"a\", 4, \" \")    = \" a  \"\n StringUtils.center(\"a\", 4, \"yz\")   = \"yayz\"\n StringUtils.center(\"abc\", 7, null) = \"  abc  \"\n StringUtils.center(\"abc\", 7, \"\")   = \"  abc  \"\n </pre>","constructor":false,"modifiers":"public static","name":"center","paramNames":["str","size","padStr"],"paramTypes":["java.lang.String","int","java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to center, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the int size of new String, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"padStr  the String to pad the new String with, must not be null or empty","name":"@param","ownerType":"METHOD"},{"comment":"centered String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException if padStr is <code> null</code> or empty","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[{"attrs":{},"name":"java.lang.Deprecated"}],"comment":"<p>Removes <code> separator</code> from the end of\n <code> str</code> if it's there, otherwise leave it alone.</p>\n\n <p>NOTE: This method changed in version 2.0.\n It now more closely matches Perl chomp.\n For the previous behavior, use <a href='javascript:scrollToAnchor(\"substringBeforeLast--\")'>String)</a>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#endsWith--'>String#endsWith(String)</ tring","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Checks if CharSequence contains a search character, handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>String#indexOf(int)</a> if possible.</p>\n\n <p>A <code> null</code> or empty (\"\") CharSequence will return <code> false</code>.</p>\n\n <pre>\n StringUtils.contains(null, *)    = false\n StringUtils.contains(\"\", *)      = false\n StringUtils.contains(\"abc\", 'a') = true\n StringUtils.contains(\"abc\", 'z') = false\n </pre>","constructor":false,"modifiers":"public static","name":"contains","paramNames":["seq","searchChar"],"paramTypes":["java.lang.CharSequence","int"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"seq  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchChar  the character to find","name":"@param","ownerType":"METHOD"},{"comment":"true if the CharSequence contains the search character,\n  false if not or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Checks if CharSequence contains a search CharSequence, handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>String#indexOf(String)</a> if possible.</p>\n\n <p>A <code> null</code> CharSequence will return <code> false</code>.</p>\n\n <pre>\n StringUtils.contains(null, *)     = false\n StringUtils.contains(*, null)     = false\n StringUtils.contains(\"\", \"\")      = true\n StringUtils.contains(\"abc\", \"\")   = true\n StringUtils.contains(\"abc\", \"a\")  = true\n StringUtils.contains(\"abc\", \"z\")  = false\n </pre>","constructor":false,"modifiers":"public static","name":"contains","paramNames":["seq","searchSeq"],"paramTypes":["java.lang.CharS h(String)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Compares two CharSequences, returning <code> true</code> if they represent\n equal sequences of characters.</p>\n\n <p><code> null</code>s are handled without exceptions. Two <code> null</code>\n references are considered to be equal. The comparison is case sensitive.</p>\n\n <pre>\n StringUtils.equals(null, null)   = true\n StringUtils.equals(null, \"abc\")  = false\n StringUtils.equals(\"abc\", null)  = false\n StringUtils.equals(\"abc\", \"abc\") = true\n StringUtils.equals(\"abc\", \"ABC\") = false\n </pre>","constructor":false,"modifiers":"public static","name":"equals","paramNames":["cs1","cs2"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"cs1  the first CharSequence, may be <code> null</code>","name":"@param","ownerType":"METHOD"},{"comment":"cs2  the second CharSequence, may be <code> null</code>","name":"@param","ownerType":"METHOD"},{"comment":"<code> true</code> if the CharSequences are equal (case-sensitive), or both <code> null</code>","name":"@return","ownerType":"METHOD"},{"comment":"Object#equals(Object)","name":"@see","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Compares two CharSequences, returning <code> true</code> if they represent\n equal sequences of characters, ignoring case.</p>\n\n <p><code> null</code>s are handled without exceptions. Two <code> null</code>\n references are considered equal. Comparison is case insensitive.</p>\n\n <pre>\n StringUtils.equalsIgnoreCase(null, null)   = true\n StringUtils.equalsIgnoreCase(null, \"abc\")  = false\n StringUtils.equalsIgnoreCase(\"abc\", null)  = false\n StringUtils.equalsIgnoreCase(\"abc\", \"abc\") = true\n StringUtils.equalsIgnoreCase(\"abc\", \"ABC\") = true\n </pre>","constructor":false,"modifiers":"public static","name":"equalsIgnoreCase","paramNames":["str1","str2"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str1  the first CharSequence, may be null","name":"@param","ownerType":"METHOD"},{"comment":"str2  the second CharSequence, may be null","name":"@param","ownerType":"METHOD"},{"comment":"<code> true</code> if the CharSequence are equal, case insensitive, or\n  both <code> null</code>","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Compares all Strings in an array and returns the initial sequence of\n characters that is common to all of them.</p>\n\n <p>For example,\n <code>getCommonPrefix(new String[] {\"i am a machine\", \"i am a robot\"}) -&gt; \"i am a \"</code></p>\n\n <pre>\n StringUtils.getCommonPrefix(null) = \"\"\n StringUtils.getCommonPrefix(new String[] {}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"abc\"}) = \"abc\"\n StringUtils.getCommonPrefix(new String[] {null, null}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"\", \"\"}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"\", null}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"abc\", null, null}) = \"\"\n StringUtils.getCommonPrefix(new String[] {null, null, \"abc\"}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"\", \"abc\"}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"abc\", \"\"}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"abc\", \"abc\"}) = \"abc\"\n StringUtils.getCommonPrefix(new String[] {\"abc\", \"a\"}) = \"a\"\n StringUtils.getCommonPrefix(new String[] {\"ab\", \"abxyz\"}) = \"ab\"\n StringUtils.getCommonPrefix(new String[] {\"abcde\", \"abxyz\"}) = \"ab\"\n StringUtils.getCommonPrefix(new String[] {\"abcde\", \"xyz\"}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"xyz\", \"abcde\"}) = \"\"\n StringUtils.getCommonPrefix(new String[] {\"i am a machine\", \"i am a robot\"}) = \"i am a \"\n </pre>","constructor":false,"modifiers":"public static","name":"getCommonPrefix","paramNames":["strs"],"paramTypes":["java.lang.String[]"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"strs  array of String objects, entries may be null","name":"@param","ownerType":"METHOD"},{"comment":"the initial sequence of characters that are common to all Strings\n in the array; empty String if the array is null, the elements are all null\n or if there is no common prefix.","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Find the Fuzzy Distance which indicates the similarity score between two Strings.</p>\n\n <p>This string matching algorithm is similar to the algorithms of editors such as Sublime Text,\n TextMate, Atom and others. One point is given for every matched character. Subsequent\n matches yield two bonus points. A higher score indicates a higher similarity.</p>\n\n <pre>\n StringUtils.getFuzzyDistance(null, null, null)                                    = IllegalArgumentException\n StringUtils.getFuzzyDistance(\"\", \"\", Locale.ENGLISH)                              = 0\n StringUtils.getFuzzyDistance(\"Workshop\", \"b\", Locale.ENGLISH)                     = 0\n StringUtils.getFuzzyDistance(\"Room\", \"o\", Locale.ENGLISH)                         = 1\n StringUtils.getFuzzyDistance(\"Workshop\", \"w\", Locale.ENGLISH)                     = 1\n StringUtils.getFuzzyDistance(\"Workshop\", \"ws\", Locale.ENGLISH)                    = 2\n StringUtils.getFuzzyDistance(\"Workshop\", \"wo\", Locale.ENGLISH)                    = 4\n StringUtils.getFuzzyDistance(\"Apache Software Foundation\", \"asf\", Locale.ENGLISH) = 3\n </pre>","constructor":false,"modifiers":"public static","name":"getFuzzyDistance","paramNames":["term","query","locale"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence","java.util.Locale"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"term a full term that should be matched against, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"query the query that will be matched against a term, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"locale This string matching logic is case insensitive. A locale is necessary to normalize\n  both Strings to lower case.","name":"@param","ownerType":"METHOD"},{"comment":"result score","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException if either String input <code> null</code> or Locale input <code> null</code>","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Find the Jaro Winkler Distance which indicates the similarity score between two Strings.</p>\n\n <p>The Jaro measure is the weighted sum of percentage of matched characters from each file and transposed characters. \n Winkler increased this measure for matching initial characters.</p>\n\n <p>This implementation is based on the Jaro Winkler similarity algorithm\n from <a href=\"http://en.wikipedia.org/wiki/Jaro%E2%80%93Winkler_distance\">http://en.wikipedia.org/wiki/Jaro%E2%80%93Winkler_distance</a>.</p>\n \n <pre>\n StringUtils.getJaroWinklerDistance(null, null)          = IllegalArgumentException\n StringUtils.getJaroWinklerDistance(\"\",\"\")               = 0.0\n StringUtils.getJaroWinklerDistance(\"\",\"a\")              = 0.0\n StringUtils.getJaroWinklerDistance(\"aaapppp\", \"\")       = 0.0\n StringUtils.getJaroWinklerDistance(\"frog\", \"fog\")       = 0.93\n StringUtils.getJaroWinklerDistance(\"fly\", \"ant\")        = 0.0\n StringUtils.getJaroWinklerDistance(\"elephant\", \"hippo\") = 0.44\n StringUtils.getJaroWinklerDistance(\"hippo\", \"elephant\") = 0.44\n StringUtils.getJaroWinklerDistance(\"hippo\", \"zzzzzzzz\") = 0.0\n StringUtils.getJaroWinklerDistance(\"hello\", \"hallo\")    = 0.88\n StringUtils.getJaroWinklerDistance(\"ABC Corporation\", \"ABC Corp\") = 0.91\n StringUtils.getJaroWinklerDistance(\"D N H Enterprises Inc\", \"D &amp; H Enterprises, Inc.\") = 0.93\n StringUtils.getJaroWinklerDistance(\"My Gym Children's Fitness Center\", \"My Gym. Childrens Fitness\") = 0.94\n StringUtils.getJaroWinklerDistance(\"PENNSYLVANIA\", \"PENNCISYLVNIA\")    = 0.9\n </pre>","constructor":false,"modifiers":"public static","name":"getJaroWinklerDistance","paramNames":["first","second"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"double","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"first the first String, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"second the second String, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"result distance","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException if either String input <code> null</code>","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Find the Levenshtein distance between two Strings.</p>\n\n <p>This is the number of changes needed to change one String into\n another, where each change is a single character modification (deletion,\n insertion or substitution).</p>\n\n <p>The previous implementation of the Levenshtein distance algorithm\n was from <a href=\"http://www.merriampark.com/ld.htm\">http://www.merriampark.com/ld.htm</a></p>\n\n <p>Chas Emerick has written an implementation in Java, which avoids an OutOfMemoryError\n which can occur when my Java implementation is used with very large strings.<br>\n This implementation of the Levenshtein distance algorithm\n is from <a href=\"http://www.merriampark.com/ldjava.htm\">http://www.merriampark.com/ldjava.htm</a></p>\n\n <pre>\n StringUtils.getLevenshteinDistance(null, *)             = IllegalArgumentException\n StringUtils.getLevenshteinDistance(*, null)             = IllegalArgumentException\n StringUtils.getLevenshteinDistance(\"\",\"\")               = 0\n StringUtils.getLevenshteinDistance(\"\",\"a\")              = 1\n StringUtils.getLevenshteinDistance(\"aaapppp\", \"\")       = 7\n StringUtils.getLevenshteinDistance(\"frog\", \"fog\")       = 1\n StringUtils.getLevenshteinDistance(\"fly\", \"ant\")        = 3\n StringUtils.getLevenshteinDistance(\"elephant\", \"hippo\") = 7\n StringUtils.getLevenshteinDistance(\"hippo\", \"elephant\") = 7\n StringUtils.getLevenshteinDistance(\"hippo\", \"zzzzzzzz\") = 8\n StringUtils.getLevenshteinDistance(\"hello\", \"hallo\")    = 1\n </pre>","constructor":false,"modifiers":"public static","name":"getLevenshteinDistance","paramNames":["s","t"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"s  the first String, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"t  the second String, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"result distance","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException if either String input <code> null</code>","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Find the Levenshtein distance between two Strings if it's less than or equal to a given\n threshold.</p>\n\n <p>This is the number of changes needed to change one String into\n another, where each change is a single character modification (deletion,\n insertion or substitution).</p>\n\n <p>This implementation follows from Algorithms on Strings, Trees and Sequences by Dan Gusfield\n and Chas Emerick's implementation of the Levenshtein distance algorithm from\n <a href=\"http://www.merriampark.com/ld.htm\">http://www.merriampark.com/ld.htm</a></p>\n\n <pre>\n StringUtils.getLevenshteinDistance(null, *, *)             = IllegalArgumentException\n StringUtils.getLevenshteinDistance(*, null, *)             = IllegalArgumentException\n StringUtils.getLevenshteinDistance(*, *, -1)               = IllegalArgumentException\n StringUtils.getLevenshteinDistance(\"\",\"\", 0)               = 0\n StringUtils.getLevenshteinDistance(\"aaapppp\", \"\", 8)       = 7\n StringUtils.getLevenshteinDistance(\"aaapppp\", \"\", 7)       = 7\n StringUtils.getLevenshteinDistance(\"aaapppp\", \"\", 6))      = -1\n StringUtils.getLevenshteinDistance(\"elephant\", \"hippo\", 7) = 7\n StringUtils.getLevenshteinDistance(\"elephant\", \"hippo\", 6) = -1\n StringUtils.getLevenshteinDistance(\"hippo\", \"elephant\", 7) = 7\n StringUtils.getLevenshteinDistance(\"hippo\", \"elephant\", 6) = -1\n </pre>","constructor":false,"modifiers":"public static","name":"getLevenshteinDistance","paramNames":["s","t","threshold"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence","int"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"s  the first String, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"t  the second String, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"threshold the target threshold, must not be negative","name":"@param","ownerType":"METHOD"},{"comment":"result distance, or <code> -1</code> if the distance would be greater than the threshold","name":"@return","ownerType":"METHOD"},{"comment":"IllegalArgumentException if either String input <code> null</code> or negative threshold","name":"@throws","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Finds the first index within a CharSequence, handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>int)</a> if possible.</p>\n\n <p>A <code> null</code> or empty (\"\") CharSequence will return <code> INDEX_NOT_FOUND (-1)</code>.</p>\n\n <pre>\n StringUtils.indexOf(null, *)         = -1\n StringUtils.indexOf(\"\", *)           = -1\n StringUtils.indexOf(\"aabaabaa\", 'a') = 0\n StringUtils.indexOf(\"aabaabaa\", 'b') = 2\n </pre>","constructor":false,"modifiers":"public static","name":"indexOf","paramNames":["seq","searchChar"],"paramTypes":["java.lang.CharSequence","int"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"seq  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchChar  the character to find","name":"@param","ownerType":"METHOD"},{"comment":"the first index of the search character,\n  -1 if no match or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Finds the first index within a CharSequence from a start position,\n handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>int)</a> if possible.</p>\n\n <p>A <code> null</code> or empty (\"\") CharSequence will return <code> (INDEX_NOT_FOUND) -1</code>.\n A negative start position is treated as zero.\n A start position greater than the string length returns <code> -1</code>.</p>\n\n <pre>\n StringUtils.indexOf(null, *, *)          = -1\n StringUtils.indexOf(\"\", *, *)            = -1\n StringUtils.indexOf(\"aabaabaa\", 'b', 0)  = 2\n StringUtils.indexOf(\"aabaabaa\", 'b', 3)  = 5\n StringUtils.indexOf(\"aabaabaa\", 'b', 9)  = -1\n StringUtils.indexOf(\"aabaabaa\", 'b', -1) = 2\n </pre>","constructor":false,"modifiers":"public static","name":"indexOf","paramNames":["seq","searchChar","startPos"],"paramTypes":["java.lang.CharSequence","int","int"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"seq  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchChar  the character to find","name":"@param","ownerType":"METHOD"},{"comment":"startPos  the start position, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"the first index of the search character (always &ge; startPos),\n  -1 if no match or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Finds the first index within a CharSequence, handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>int)</a> if possible.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.</p>\n\n <pre>\n StringUtils.indexOf(null, *)          = -1\n StringUtils.indexOf(*, null)          = -1\n StringUtils.indexOf(\"\", \"\")           = 0\n StringUtils.indexOf(\"\", *)            = -1 (except when * = \"\")\n StringUtils.indexOf(\"aabaabaa\", \"a\")  = 0\n StringUtils.indexOf(\"aabaabaa\", \"b\")  = 2\n StringUtils.indexOf(\"aabaabaa\", \"ab\") = 1\n StringUtils.indexOf(\"aabaabaa\", \"\")   = 0\n </pre>","constructor":false,"modifiers":"public static","name":"indexOf","paramNames":["seq","searchSeq"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"seq  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchSeq  the CharSequence to find, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the first index of the search CharSequence,\n  -1 if no match or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Finds the first index within a CharSequence, handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>int)</a> if possible.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.\n A negative start position is treated as zero.\n An empty (\"\") search CharSequence always matches.\n A start position greater than the string length only matches\n an empty search CharSequence.</p>\n\n <pre>\n StringUtils.indexOf(null, *, *)          = -1\n StringUtils.indexOf(*, null, *)          = -1\n StringUtils.indexOf(\"\", \"\", 0)           = 0\n StringUtils.indexOf(\"\", *, 0)            = -1 (except when * = \"\")\n StringUtils.indexOf(\"aabaabaa\", \"a\", 0)  = 0\n StringUtils.indexOf(\"aabaabaa\", \"b\", 0)  = 2\n StringUtils.indexOf(\"aabaabaa\", \"ab\", 0) = 1\n StringUtils.indexOf(\"aabaabaa\", \"b\", 3)  = 5\n StringUtils.indexOf(\"aabaabaa\", \"b\", 9)  = -1\n StringUtils.indexOf(\"aabaabaa\", \"b\", -1) = 2\n StringUtils.indexOf(\"aabaabaa\", \"\", 2)   = 2\n StringUtils.indexOf(\"abc\", \"\", 9)        = 3\n </pre>","constructor":false,"modifiers":"public static","name":"indexOf","paramNames":["seq","searchSeq","startPos"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence","int"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"seq  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchSeq  the CharSequence to find, may be null","name":"@param","ownerType":"METHOD"},{"comment":"startPos  the start position, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"the first index of the search CharSequence (always &ge; startPos),\n  -1 if no match or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Find the first index of any of a set of potential substrings.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.\n A <code> null</code> or zero length search array will return <code> -1</code>.\n A <code> null</code> search array entry will be ignored, but a search\n array containing \"\" will return <code> 0</code> if <code> str</code> is not\n null. This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>String#indexOf(String)</a> if possible.</p>\n\n <pre>\n StringUtils.indexOfAny(null, *)                     = -1\n StringUtils.indexOfAny(*, null)                     = -1\n StringUtils.indexOfAny(*, [])                       = -1\n StringUtils.indexOfAny(\"zzabyycdxx\", [\"ab\",\"cd\"])   = 2\n StringUtils.indexOfAny(\"zzabyycdxx\", [\"cd\",\"ab\"])   = 2\n StringUtils.indexOfAny(\"zzabyycdxx\", [\"mn\",\"op\"])   = -1\n StringUtils.indexOfAny(\"zzabyycdxx\", [\"zab\",\"aby\"]) = 1\n StringUtils.indexOfAny(\"zzabyycdxx\", [\"\"])          = 0\n StringUtils.indexOfAny(\"\", [\"\"])                    = 0\n StringUtils.indexOfAny(\"\", [\"a\"])                   = -1\n </pre>","constructor":false,"modifiers":"public static","name":"indexOfAny","paramNames":["str","searchStrs"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence[]"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchStrs  the CharSequences to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the first index of any of the searchStrs in str, -1 if no match","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Search a CharSequence to find the first index of any\n character not in the given set of characters.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.\n A <code> null</code> or empty search string will return <code> -1</code>.</p>\n\n <pre>\n StringUtils.indexOfAnyBut(null, *)            = -1\n StringUtils.indexOfAnyBut(\"\", *)              = -1\n StringUtils.indexOfAnyBut(*, null)            = -1\n StringUtils.indexOfAnyBut(*, \"\")              = -1\n StringUtils.indexOfAnyBut(\"zzabyycdxx\", \"za\") = 3\n StringUtils.indexOfAnyBut(\"zzabyycdxx\", \"\")   = -1\n StringUtils.indexOfAnyBut(\"aba\",\"ab\")         = -1\n </pre>","constructor":false,"modifiers":"public static","name":"indexOfAnyBut","paramNames":["seq","searchChars"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"seq  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchChars  the chars to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the index of any of the chars, -1 if no match or null input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Compares two CharSequences, and returns the index at which the\n CharSequences begin to differ.</p>\n\n <p>For example,\n <code> indexOfDifference(\"i am a machine\", \"i am a robot\") -> 7</code></p>\n\n <pre>\n StringUtils.indexOfDifference(null, null) = -1\n StringUtils.indexOfDifference(\"\", \"\") = -1\n StringUtils.indexOfDifference(\"\", \"abc\") = 0\n StringUtils.indexOfDifference(\"abc\", \"\") = 0\n StringUtils.indexOfDifference(\"abc\", \"abc\") = -1\n StringUtils.indexOfDifference(\"ab\", \"abxyz\") = 2\n StringUtils.indexOfDifference(\"abcde\", \"abxyz\") = 2\n StringUtils.indexOfDifference(\"abcde\", \"xyz\") = 0\n </pre>","constructor":false,"modifiers":"public static","name":"indexOfDifference","paramNames":["cs1","cs2"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"cs1  the first CharSequence, may be null","name":"@param","ownerType":"METHOD"},{"comment":"cs2  the second CharSequence, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the index where cs1 and cs2 begin to differ; -1 if they are equal","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Compares all CharSequences in an array and returns the index at which the\n CharSequences begin to differ.</p>\n\n <p>For example,\n <code>indexOfDifference(new String[] {\"i am a machine\", \"i am a robot\"}) -&gt; 7</code></p>\n\n <pre>\n StringUtils.indexOfDifference(null) = -1\n StringUtils.indexOfDifference(new String[] {}) = -1\n StringUtils.  StringUtils.lastIndexOf(\"\", *)           = -1\n StringUtils.lastIndexOf(\"aabaabaa\", 'a') = 7\n StringUtils.lastIndexOf(\"aabaabaa\", 'b') = 5\n </pre>","constructor":false,"modifiers":"public static","name":"lastIndexOf","paramNames":["seq","searchChar"],"paramTypes":["java.lang.CharSequence","int"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"seq  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchChar  the character to find","name":"@param","ownerType":"METHOD"},{"comment":"the last index of the search character,\n  -1 if no match or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Finds the last index within a CharSequence from a start position,\n handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#lastIndexOf--'>int)</a> if possible.</p>\n\n <p>A <code> null</code> or empty (\"\") CharSequence will return <code> -1</code>.\n A negative start position returns <code> -1</code>.\n A start position greater than the string length searches the whole string.\n The search starts at the startPos and works backwards; matches starting after the start\n position are ignored.\n </p>\n\n <pre>\n StringUtils.lastIndexOf(null, *, *)          = -1\n StringUtils.lastIndexOf(\"\", *,  *)           = -1\n StringUtils.lastIndexOf(\"aabaabaa\", 'b', 8)  = 5\n StringUtils.lastIndexOf(\"aabaabaa\", 'b', 4)  = 2\n StringUtils.lastIndexOf(\"aabaabaa\", 'b', 0)  = -1\n StringUtils.lastIndexOf(\"aabaabaa\", 'b', 9)  = 5\n StringUtils.lastIndexOf(\"aabaabaa\", 'b', -1) = -1\n StringUtils.lastIndexOf(\"aabaabaa\", 'a', 0)  = 0\n </pre>","constructor":false,"modifiers":"public static","name":"lastIndexOf","paramNames":["seq","searchChar","startPos"],"paramTypes":["java.lang.CharSequence","int","int"],"returnType":"int","scriptDeprecated":false," e latest index of any of a set of potential substrings.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.\n A <code> null</code> search array will return <code> -1</code>.\n A <code> null</code> or zero length search array entry will be ignored,\n but a search array containing \"\" will return the length of <code> str</code>\n if <code> str</code> is not null. This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>String#indexOf(String)</a> if possible</p>\n\n <pre>\n StringUtils.lastIndexOfAny(null, *)                   = -1\n StringUtils.lastIndexOfAny(*, null)                   = -1\n StringUtils.lastIndexOfAny(*, [])                     = -1\n StringUtils.lastIndexOfAny(*, [null])                 = -1\n StringUtils.lastIndexOfAny(\"zzabyycdxx\", [\"ab\",\"cd\"]) = 6\n StringUtils.lastIndexOfAny(\"zzabyycdxx\", [\"cd\",\"ab\"]) = 6\n StringUtils.lastIndexOfAny(\"zzabyycdxx\", [\"mn\",\"op\"]) = -1\n StringUtils.lastIndexOfAny(\"zzabyycdxx\", [\"mn\",\"op\"]) = -1\n StringUtils.lastIndexOfAny(\"zzabyycdxx\", [\"mn\",\"\"])   = 10\n </pre>","constructor":false,"modifiers":"public static","name":"lastIndexOfAny","paramNames":["str","searchStrs"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence[]"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchStrs  the CharSequences to search for, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the last index of any of the CharSequences, -1 if no match","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Case in-sensitive find of the last index within a CharSequence.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.\n A negative start position returns <code> -1</code>.\n An empty (\"\") search CharSequence always matches unless the start position is negative.\n A start position greater than the string length searches the whole string.</p>\n\n <pre>\n StringUtils.lastIndexOfIgnoreCase(null, *)          = -1\n StringUtils.lastIndexOfIgnoreCase(*, null)          = -1\n StringUtils.lastIndexOfIgnoreCase(\"aabaabaa\", \"A\")  = 7\n StringUtils.lastIndexOfIgnoreCase(\"aabaabaa\", \"B\")  = 5\n StringUtils.lastIndexOfIgnoreCase(\"aabaabaa\", \"AB\") = 4\n </pre>","constructor":false,"modifiers":"public static","name":"lastIndexOfIgnoreCase","paramNames":["str","searchStr"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchStr  the CharSequence to find, may be null","name":"@param","ownerType":"METHOD"},{"comment":"the first index of the search CharSequence,\n  -1 if no match or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Case in-sensitive find of the last index within a CharSequence\n from the specified position.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.\n A negative start position returns <code> -1</code>.\n An empty (\"\") search CharSequence always matches unless the start position is negative.\n A start position greater than the string length searches the whole string.\n The search starts at the startPos and works backwards; matches starting after the start\n position are ignored.\n </p>\n\n <pre>\n StringUtils.lastIndexOfIgnoreCase(null, *, *)          = -1\n StringUtils.lastIndexOfIgnoreCase(*, null, *)          = -1\n StringUtils.lastIndexOfIgnoreCase(\"aabaabaa\", \"A\", 8)  = 7\n StringUtils.lastIndexOfIgnoreCase(\"aabaabaa\", \"B\", 8)  = 5\n StringUtils.lastIndexOfIgnoreCase(\"aabaabaa\", \"AB\", 8) = 4\n StringUtils.lastIndexOfIgnoreCase(\"aabaabaa\", \"B\", 9) }],"throwExceptions":[]},{"annotations":[],"comment":"<p>Left pad a String with spaces (' ').</p>\n\n <p>The String is padded to the size of <code> size</code>.</p>\n\n <pre>\n StringUtils.leftPad(null, *)   = null\n StringUtils.leftPad(\"\", 3)     = \"   \"\n StringUtils.leftPad(\"bat\", 3)  = \"bat\"\n StringUtils.leftPad(\"bat\", 5)  = \"  bat\"\n StringUtils.leftPad(\"bat\", 1)  = \"bat\"\n StringUtils.leftPad(\"bat\", -1) = \"bat\"\n </pre>","constructor":false,"modifiers":"public static","name":"leftPad","paramNames":["str","size"],"paramTypes":["java.lang.String","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to pad out, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the size to pad to","name":"@param","ownerType":"METHOD"},{"comment":"left padded String or original String if no padding is necessary,\n  <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Left pad a String with a specified character.</p>\n\n <p>Pad to a size of <code> size</code>.</p>\n\n <pre>\n StringUtils.leftPad(null, *, *)     = null\n StringUtils.leftPad(\"\", 3, 'z')     = \"zzz\"\n StringUtils.leftPad(\"bat\", 3, 'z')  = \"bat\"\n StringUtils.leftPad(\"bat\", 5, 'z')  = \"zzbat\"\n StringUtils.leftPad(\"bat\", 1, 'z')  = \"bat\"\n StringUtils.leftPad(\"bat\", -1, 'z') = \"bat\"\n </pre>","constructor":false,"modifiers":"public static","name":"leftPad","paramNames":["str","size","padChar"],"paramTypes":["java.lang.String","int","char"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to pad out, may be null","name":"@param","ownerType":"METHOD"},{"comment":"size  the size to pad to","name":"@param","ownerType":"METHOD"},{"comment":"padChar  the character to pad with","name":"@param","ownerType":"METHOD"},{"comment":"left padded String or original S tatic","name":"lowerCase","paramNames":["str","locale"],"paramTypes":["java.lang.String","java.util.Locale"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to lower case, may be null","name":"@param","ownerType":"METHOD"},{"comment":"locale  the locale that defines the case transformation rules, must not be null","name":"@param","ownerType":"METHOD"},{"comment":"the lower cased String, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Gets <code> len</code> characters from the middle of a String.</p>\n\n <p>If <code> len</code> characters are not available, the remainder\n of the String will be returned without an exception. If the\n String is <code> null</code>, <code> null</code> will be returned.\n An empty String is returned if len is negative or exceeds the\n length of <code> str</code>.</p>\n\n <pre>\n StringUtils.mid(null, *, *)    = null\n StringUtils.mid(*, *, -ve)     = \"\"\n StringUtils.mid(\"\", 0, *)      = \"\"\n StringUtils.mid(\"abc\", 0, 2)   = \"ab\"\n StringUtils.mid(\"abc\", 0, 4)   = \"abc\"\n StringUtils.mid(\"abc\", 2, 4)   = \"c\"\n StringUtils.mid(\"abc\", 4, 2)   = \"\"\n StringUtils.mid(\"abc\", -2, 2)  = \"ab\"\n </pre>","constructor":false,"modifiers":"public static","name":"mid","paramNames":["str","pos","len"],"paramTypes":["java.lang.String","int","int"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the String to get the characters from, may be null","name":"@param","ownerType":"METHOD"},{"comment":"pos  the position to start from, negative treated as zero","name":"@param","ownerType":"METHOD"},{"comment":"len  the length of the required String","name":"@param","ownerType":"METHOD"},{"comment":"the middle characters, <code> null</code> if null String input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotation },{"annotations":[],"comment":"<p>Finds the n-th index within a CharSequence, handling <code> null</code>.\n This method uses <a href='?nav=class&module=kd.bos.dataentity&package=kd.bos.dataentity.utils&name=String#indexOf--'>String#indexOf(String)</a> if possible.</p>\n\n <p>A <code> null</code> CharSequence will return <code> -1</code>.</p>\n\n <pre>\n StringUtils.ordinalIndexOf(null, *, *)          = -1\n StringUtils.ordinalIndexOf(*, null, *)          = -1\n StringUtils.ordinalIndexOf(\"\", \"\", *)           = 0\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"a\", 1)  = 0\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"a\", 2)  = 1\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"b\", 1)  = 2\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"b\", 2)  = 5\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"ab\", 1) = 1\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"ab\", 2) = 4\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"\", 1)   = 0\n StringUtils.ordinalIndexOf(\"aabaabaa\", \"\", 2)   = 0\n </pre>\n\n <p>Note that 'head(CharSequence str, int n)' may be implemented as: </p>\n\n <pre>\n   str.substring(0, lastOrdinalIndexOf(str, \"\\n\", n))\n </pre>","constructor":false,"modifiers":"public static","name":"ordinalIndexOf","paramNames":["str","searchStr","ordinal"],"paramTypes":["java.lang.CharSequence","java.lang.CharSequence","int"],"returnType":"int","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"str  the CharSequence to check, may be null","name":"@param","ownerType":"METHOD"},{"comment":"searchStr  the CharSequence to find, may be null","name":"@param","ownerType":"METHOD"},{"comment":"ordinal  the n-th <code> searchStr</code> to find","name":"@param","ownerType":"METHOD"},{"comment":"the n-th index of the search CharSequence,\n  <code> -1</code> (<code> INDEX_NOT_FOUND</code>) if no match or <code> null</code> string input","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<p>Overlays part of a String with another String.
