<!DOCTYPE html><html><head><meta charset="utf-8"><title>CardMatchOffShiftExtPlugin</title><script type="text/javascript" src="../../../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"取卡匹配-取卡匹配无时段off班扩展插件\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"取卡匹配计算拓展插件","commented":2,"declare":"public interface CardMatchOffShiftExtPlugin","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"取卡匹配-匹配off班（单档案单天）计算，获取当天off班无时段的取卡规则的取卡范围之后会调用改接口。\n\n <p>\n 可根据入参数据对入参的初始的取卡范围的开始时间秒数（int），取卡范围的结束时间秒数（int）进行处理并返回，支持负数。\n 比如人参的匹配日期为2023-10-01，开始时间秒数=7200，结束时间秒数=86399，说明初始的取卡范围为[2023-10-01 02:00:00~2023-10-01 23:59:59]\n 修改入参的开始时间秒数=-1200，结束时间秒数=93600。说明拓展后的取卡范围为[2023-09-30 23:40:00~2023-10-02 02:00:00]\n 不修改开始结束时间秒数则取卡范围无变化，也可只修改开始结束时间秒数其中之一，也可全修改。\n </p>\n\n <p>拓展示例：</p>\n <pre><code>\n     public void afterOffShiftTakeCardRange(OffShiftTakeCardRangeEvent event) {\n         // 根据入参信息获取匹配日期的取卡范围需要往前往后延多少时间(秒数)\n         event.setRangeStartSecords(event.getRangeStartSecords() - 1200);\n         event.setRangeEndSecords(event.getRangeEndSecords() + 7200);\n     }\n </code></pre>","constructor":false,"modifiers":"default","name":"afterOffShiftTakeCardRange","paramNames":["event"],"paramTypes":["kd.sdk.wtc.wtpm.business.cardmatch.OffShiftTakeCardRangeEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"event off班无时段班次取卡范围后置设置事件","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"CardMatchOffShiftExtPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};	
	//--></script></head><body></body></html>
