<!DOCTYPE html><html><head><meta charset="utf-8"><title>TieSaveAllAttPeriodDataExtPlugin</title><script type="text/javascript" src="../../../../../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"考勤核算保存所有期间汇总核算结果数据扩展接口\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"考勤核算保存所有期间汇总核算结果数据扩展接口","commented":2,"declare":"public interface TieSaveAllAttPeriodDataExtPlugin","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"写入所有考勤核算汇总结果数据后置事件方法，支持在汇总核算结果数据写入后处理扩展逻辑，比如写入其他期间汇总数据。\n <p>当标品期间汇总结果数据入库后，调用此扩展，处理个性化的扩展逻辑，比如写入其他期间汇总数据</p>\n <pre><code>\n     public void afterSaveAllPerPeriodDataResult(AfterSaveAllPerPeriodDataResultEvent afterSaveAllPerPeriodDataResultEvent) {\n         try {\n             // 考勤核算期间汇总上下文，含页面请求参数，实际考勤核算主体，所有要期间汇总的人员考勤期间集合等\n             TieAttPeriodContextExt tieAttPeriodContextExt = afterSaveAllPerPeriodDataResultEvent.getTieAttPeriodContextExt();\n             // 考勤核算的页面请求参数\n             TieRequestExt tieRequestExt = tieAttPeriodContextExt.getTieRequestExt();\n             // 实际的考勤核算主体\n             List<TieAttSubjectExt> attSubjects = tieAttPeriodContextExt.getAttSubjects();\n             DynamicObjectCollection dynamicObjects = new DynamicObjectCollection();\n             attSubjects.forEach(item -> {\n                 // 构建元数据（kdtest_wtctd_atttotal）动态对象\n                 DynamicObject ext = BusinessDataServiceHelper.newDynamicObject(\"kdtest_wtctd_atttotal\");\n                 ext.set(\"taskid\", tieRequestExt.getTaskId());\n                 ext.set(\"version\", tieRequestExt.getVersion());\n                 ext.set(\"totalpersoncount\", attSubjects.size());\n                 ext.set(\"personid\", item.getAttPersonId());\n                 dynamicObjects.add(ext);\n             });\n             HRBaseServiceHelper serviceHelper = new HRBaseServiceHelper(\"kdtest_wtctd_atttotal\");\n             // 数据入库\n             serviceHelper.save(dynamicObjects);\n         } catch (Exception ex) {\n             logger.warn(\"TieSaveAllAttPeriodDataExtPluginDemo.afterSaveAllPerPeriodDataResult error\", ex);\n         }\n     }\n </code></pre>","constructor":false,"modifiers":"","name":"afterSaveAllPerPeriodDataResult","paramNames":["afterSaveAllPerPeriodDataResultEvent"],"paramTypes":["kd.sdk.wtc.wtes.business.tie.persistent.period.AfterSaveAllPerPeriodDataResultEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"afterSaveAllPerPeriodDataResultEvent 写入所有考勤核算汇总结果数据后置事件","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"TieSaveAllAttPeriodDataExtPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
