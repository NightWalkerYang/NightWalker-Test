<!DOCTYPE html><html><head><meta charset="utf-8"><title>TieCleanExDataExtPlugin</title><script type="text/javascript" src="../../../../../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"考勤核算清理异常核算结果数据扩展接口\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"考勤核算清理异常核算结果数据扩展接口","commented":2,"declare":"public interface TieCleanExDataExtPlugin","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"清理异常数据后置事件方法，支持清理异常考勤核算结果数据后处理扩展逻辑，比如删除客开的异常考勤核算结果数据。\n <p>当标品清理异常数据执行后，调用此扩展，删除个性化的异常考勤核算结果数据</p>\n <pre><code>\n public void afterCleanExData(AfterCleanExDataEvent afterCleanExDataEvent) {\n         try {\n             // 获取核算信息集合\n             List<AttStateExt> attStateExtList = afterCleanExDataEvent.getAttStateExtList();\n             // 页面发起核算请求的考勤档案boId，并非实际核算的\n             List<Long> requestAttFileBoIdList = afterCleanExDataEvent.getTieRequestExt().getAttFileBoIdList();\n             // 记录有异常的考勤档案boId\n             List<Long> attFileBoIdList = new ArrayList<>();\n             for (AttStateExt attStateInfoBO : attStateExtList) {\n                 // 判断是否有异常\n                 if (attStateInfoBO.isExState() != null && !attStateInfoBO.isExState()) {\n                     continue;\n                 }\n                 // 已锁定至\n                 Date lockToDate = attStateInfoBO.getLockTo();\n                 // 异常开始日期\n                 Date exStartDate = attStateInfoBO.getExcStartDate();\n                 // 异常结束日期\n                 Date exEndDate = attStateInfoBO.getExcEndDate();\n                 // 档案BoId\n                 Long fileBoId = attStateInfoBO.getFileBoId();\n                 if (lockToDate != null && lockToDate.getTime() >= exStartDate.getTime()) {\n                     // 不清除\n                 } else {\n                     attFileBoIdList.add(fileBoId);\n                     // 如按考勤档案boId和异常开始日期进行清理\n                     // doClearByAttFileBoId(fileBoId, exStartDate);\n                 }\n             }\n         } catch (Exception ex) {\n             logger.warn(\"TieCleanExDataExtPluginDemo.afterCleanExData error\", ex);\n         }\n     }\n </code></pre>","constructor":false,"modifiers":"","name":"afterCleanExData","paramNames":["afterCleanExDataEvent"],"paramTypes":["kd.sdk.wtc.wtes.business.tie.persistent.clean.AfterCleanExDataEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"afterCleanExDataEvent 清理异常数据后置事件","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"TieCleanExDataExtPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
