		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"考勤核算初始化扩展服务\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"考勤核算配置组合初始化扩展服务","commented":2,"declare":"public interface TieConfigMixInitPlugin","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"查询考勤核算数据源的配置组合\n 返回的结果必须查询出这些配置组合中的属性countryid.number,attitemmap.id,attstsmap.id,tbpcrelcnf.id,entryentity.biztype,entryentity.exattr,entryentity.attendattr,entryentity.datasource\n\n 目前是取第一个配置组合(目前所有人只能用同一个配置组合)\n <p>查询配置组合方法</p>\n\n <p>扩展示例如下,可以参考 @kd.sdk.wtc.wtes.business.tie.init.configmix.ConfigMixInitPluginDemo</p>\n <pre><code>\n\n      public void onQuery(TieConfigMixQueryEvent event) {\n         QFilter[] qFilters = new QFilter[3];\n         qFilters[0] = new QFilter(\"status\", QCP.equals, \"C\");\n         qFilters[1] = new QFilter(\"iscurrentversion\", QCP.equals, Boolean.TRUE);\n         qFilters[2] = new QFilter(\"enable\", QCP.equals, \"1\");\n         DynamicObject[] dynamicObjects = BusinessDataServiceHelper.load(\"wtbd_confcombin\", \"countryid.number,attitemmap.id,attstsmap.id,tbpcrelcnf.id,entryentity.biztype,entryentity.exattr,entryentity.attendattr,entryentity.datasource\", qFilters);\n\n         // 设置查询的组合配置\n         event.addConfigMixResult(Arrays.asList(dynamicObjects));\n     }\n\n </code></pre>","constructor":false,"modifiers":"","name":"onQuery","paramNames":["event"],"paramTypes":["kd.sdk.wtc.wtes.business.tie.init.configmix.TieConfigMixQueryEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"event 查询事件,返回结果放入查询事件","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"TieConfigMixInitPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
