		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"特殊假休假申请扩展服务\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"特殊假休假申请扩展服务","commented":3,"declare":"public interface SpecialVaExpService","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"自动生成自定义哺乳假休假方式的哺乳假休假时段，系统根据这个时间段\n\n <p>生成时间段应当在班次时段范围内且和班次内上班时段有时段交集，否则识别出时长会为0\n 班次内上班时段和当天生成的总时间范围交集时长不得超过maxVaTime,否则会触发每日可休时长校验导致校验不通过\n 生成的开始-结束时间对不允许和多个日期班次的时段范围交集，否则会触发跨班校验导致校验不通过\n 接口调用方式为：按日循环调用</p>\n\n <p>扩展示例如下</p>\n <pre><code>\n public List<SpecialVaTimeDto> createSubEntry(SpecialVaTimeParam specialVaTimeParam) {\n      LocalDateTime startTime = req.getDate().atTime(9, 0, 0, 0);\n      LocalDateTime endTime = req.getDate().atTime(11, 30, 0, 0);\n      return Lists.newArrayList(new SpecialVaTimeDto(startTime, endTime));\n }\n </code></pre>","constructor":false,"modifiers":"","name":"createSubEntry","paramNames":["specialVaTimeParam"],"paramTypes":["kd.sdk.wtc.wtabm.business.spva.SpecialVaTimeParam"],"returnType":"java.util.List<kd.sdk.wtc.wtabm.business.spva.SpecialVaTimeDto>","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"specialVaTimeParam 生成休假明细时间段入参","name":"@param","ownerType":"METHOD"},{"comment":"对应班次开始日的休假明细时间区间","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"判断特殊假休假方式是否自动生成时段\n\n\n <p>当选择哺乳假休假方式之后，如果选中二开扩展的哺乳假休假方式，会调用此扩展点；如果返回true,则系统会继续后续校验，并生成休假时段，对时段计算时长并最终生成休假明细子分录信息\n 如果结果为false,则认为需要继续填写页面信息，不会触发后续校验和生成时长等</p>\n\n <p>扩展示例如下</p>\n <pre><code>\n public boolean isAutoCreateSubEntry(DynamicObject spvaTypeDyn) {\n         String number = spvaTypeDyn.getString(\"number\");\n         return StringUtils.equalsAny(number, \"1011_S\", \"1012_s\");\n }\n </code></pre>","constructor":false,"modifiers":"","name":"isAutoCreateSubEntry","paramNames":["spvaTypeDyn"],"paramTypes":["DynamicObject"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"spvaTypeDyn 特殊假休假方式的动态对象，可以取的属性集为：id、number、name","name":"@param","ownerType":"METHOD"},{"comment":"如果需要自动生成时段则返回true","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"SpecialVaExpService","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
