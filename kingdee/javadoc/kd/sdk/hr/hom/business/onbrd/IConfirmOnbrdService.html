<!DOCTYPE html><html><head><meta charset="utf-8"><title>IConfirmOnbrdService</title><script type="text/javascript" src="../../../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"},{"attrs":{"name":"\"确认入职-扩展业务插件\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"确认入职-扩展业务插件示例\n<pre><code>\n package kd.hr.hom.unittest.hrext.service;\n\n import kd.bos.dataentity.entity.DynamicObject;\n import kd.bos.dataentity.resource.ResManager;\n import kd.hr.hom.business.domain.repository.common.HomCommonRepository;\n import kd.hr.hom.common.constant.CheckinIdentifyConstants;\n import kd.hr.hom.common.constant.HOMConstants;\n import kd.hr.hom.common.constant.OnbrdPersonFieldConstants;\n import kd.hr.hom.common.constant.OnbrdPersonPageConstants;\n import kd.sdk.hr.hom.business.onbrd.IConfirmOnbrdService;\n\n import java.util.ArrayList;\n import java.util.HashMap;\n import java.util.List;\n import java.util.Map;\n\n public class ConfirmOnbrdServiceImpl implements IConfirmOnbrdService {\n    public void beforeConfirmOnbrds(Object... onbrdIds) {\n        HomCommonRepository.queryDynamicObjectByPks(OnbrdPersonPageConstants.HOM_ONBRDBILLTPL, \"id,name\",\n                onbrdIds);\n    }\n\n    public boolean tpiInfo(List<String> errMsglist, List<String> emptyFileds, String operateKey, boolean isMobile, DynamicObject onbrdBillDetailInfo) {\n        errMsglist.add(emptyFiledCheck(emptyFileds, operateKey, isMobile,onbrdBillDetailInfo));\n        return false;\n    }\n\n    private String emptyFiledCheck(List<String> emptyFileds, String operateKey, boolean isMobile,DynamicObject onbrdBillDetailInfo) {\n        String service14;\n        String kdString = ResManager.loadKDString(\"待入职人员的 %1$s 不能为空 , %2$s\",\n                \"OnbrdConfirmValidatorService_14\",\n                HOMConstants.TYPE_BUSINESS);\n        //工号和证件号码特殊处理\n\n        //证件号码\n        String s1 = ResManager.loadKDString(\"请前往入职人员信息录入\",\n                \"OnbrdConfirmValidatorService_15\",\n                HOMConstants.TYPE_BUSINESS);\n        //工号 请在用人单位信息处录入\n        String s2 = ResManager.loadKDString(\"请联系管理员\",\n                \"OnbrdConfirmValidatorService_15\",\n                HOMConstants.TYPE_BUSINESS);\n        //其他字段 请在入职报到信息处录入\n        String s3 = ResManager.loadKDString(\"请在入职办理单详情页录入\",\n                \"OnbrdConfirmValidatorService_15\",\n                HOMConstants.TYPE_BUSINESS);\n\n        //预约报道 请前往入职办理页面录入\n        String s4 = ResManager.loadKDString(\"请在入职办理单详情页录入\",\n                \"OnbrdConfirmValidatorService_15\",\n                HOMConstants.TYPE_BUSINESS);\n\n        Map<String, String> nameMap = getRequiredFieldNameMap(onbrdBillDetailInfo);\n\n        if (!CheckinIdentifyConstants.BTN_CONFIRM_CHECKIN.equals(operateKey)) {\n            //入职办理单\n            //工号、证件号码\n            ArrayList<String> list = new ArrayList<>();\n            ArrayList<String> emptyList = new ArrayList<>();\n\n            emptyFileds.forEach(emptyFiled -> {\n                if (emptyFiled.equals(nameMap.get(OnbrdPersonFieldConstants.CERTIFICATENUMBER))) {\n                    list.add(String.format(kdString, emptyFiled, s1));\n                } else if (emptyFiled.equals(nameMap.get(OnbrdPersonFieldConstants.EMPLOYEENO))) {\n                    list.add(String.format(kdString, emptyFiled, s2));\n                } else {\n                    emptyList.add(emptyFiled);\n                }\n            });\n            //其他\n            if (emptyList.size() != 0) {\n                list.add(String.format(kdString, String.join(\"、\", emptyList), s3));\n            }\n            service14 = String.join(\"\\n\", list);\n        } else {\n            //预约报道\n            if (isMobile) {\n                //移动端预约报道\n                service14 = String.format(ResManager.loadKDString(\"您的%s暂未生成，请联系入职服务人员处理\",\n                        \"OnbrdConfirmValidatorService_15\",\n                        HOMConstants.TYPE_BUSINESS), String.join(\"、\", emptyFileds));\n            } else {\n                service14 = String.format(kdString, String.join(\"、\", emptyFileds), s4);\n            }\n            //移动端, 候选人点击确认报到\n        }\n\n        //预约报道工号\n        return service14;\n    }\n\n    private Map<String, String> getRequiredFieldNameMap(DynamicObject onbrdBillDetailInfo) {\n        Map<String, String> checkIfEmptyFieldMap = new HashMap<>();\n        // 入职日期\n        getFieldName(onbrdBillDetailInfo, checkIfEmptyFieldMap, OnbrdPersonFieldConstants.EFFECTDATE, ResManager.loadKDString(\"入职日期\", \"OnbrdConfirmValidatorService_1\", HOMConstants.TYPE_BUSINESS));\n        // 工号\n        getFieldName(onbrdBillDetailInfo, checkIfEmptyFieldMap, OnbrdPersonFieldConstants.EMPLOYEENO, ResManager.loadKDString(\"工号\", \"OnbrdConfirmValidatorService_2\", HOMConstants.TYPE_BUSINESS));\n        // 姓名\n        getFieldName(onbrdBillDetailInfo, checkIfEmptyFieldMap, OnbrdPersonFieldConstants.NAME, ResManager.loadKDString(\"姓名\", \"OnbrdConfirmValidatorService_3\", HOMConstants.TYPE_BUSINESS));\n        // 候选人\n        getFieldName(onbrdBillDetailInfo, checkIfEmptyFieldMap, OnbrdPersonFieldConstants.CANDIDATE, ResManager.loadKDString(\"关联的候选人\", \"OnbrdConfirmValidatorService_4\", HOMConstants.TYPE_BUSINESS));\n        // 证件号码\n        getFieldName(onbrdBillDetailInfo, checkIfEmptyFieldMap, OnbrdPersonFieldConstants.CERTIFICATENUMBER,ResManager.loadKDString(\"证件号码\", \"OnbrdConfirmValidatorService_5\", HOMConstants.TYPE_BUSINESS));\n        return checkIfEmptyFieldMap;\n    }\n\n    private void getFieldName(DynamicObject onbrdBillDetailInfo, Map<String, String> checkIfEmptyFieldMap, String key, String loadKDString) {\n        String effectDate;\n        if (onbrdBillDetailInfo.getDataEntityType().getProperties().containsKey(key)) {\n            effectDate = onbrdBillDetailInfo.getDataEntityType().getProperties().get(key).getDisplayName().getLocaleValue();\n        } else {\n            effectDate = loadKDString;\n        }\n        checkIfEmptyFieldMap.put(key, effectDate);\n    }\n\n}\n</code></pre>","commented":3,"declare":"public interface IConfirmOnbrdService","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"确认入职之前执行的扩展代码","constructor":false,"modifiers":"","name":"beforeConfirmOnbrds","paramNames":["onbrdIds"],"paramTypes":["java.lang.Object[]"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"onbrdIds 入职单","name":"@param","ownerType":"METHOD"},{"comment":"boolean","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"自定义确认入职的错误提示信息","constructor":false,"modifiers":"","name":"tpiInfo","paramNames":["errMsglist","emptyFileds","operateKey","isMobile","onbrdBillDetailInfo"],"paramTypes":["java.util.List<java.lang.String>","java.util.List<java.lang.String>","java.lang.String","boolean","DynamicObject"],"returnType":"boolean","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"errMsglist          错误信息","name":"@param","ownerType":"METHOD"},{"comment":"emptyFileds         空字段标识","name":"@param","ownerType":"METHOD"},{"comment":"operateKey          操作按钮","name":"@param","ownerType":"METHOD"},{"comment":"isMobile            是否移动端","name":"@param","ownerType":"METHOD"},{"comment":"onbrdBillDetailInfo 入职单据详情","name":"@param","ownerType":"METHOD"},{"comment":"true/false 二开方案默认false","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IConfirmOnbrdService","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
