<!DOCTYPE html><html><head><meta charset="utf-8"><title>IOnbrdService</title><script type="text/javascript" src="../../../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"},{"attrs":{"name":"\"入职单导入埋点\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"入职单导入埋点服务，主要用于入职单导入和初始化\n <pre><code>\n\npackage kd.hr.hom.unittest.hrext.business.onbrd;\n\nimport com.alibaba.fastjson.JSONObject;\nimport kd.bos.dataentity.entity.DynamicObject;\nimport kd.bos.entity.plugin.ImportLogger;\nimport kd.bos.form.plugin.impt.ImportBillData;\nimport kd.hr.hbp.common.util.HRStringUtils;\nimport kd.hr.hom.common.constant.MultiEntityImportConstants;\nimport kd.hr.hom.common.constant.OnbrdPersonPageConstants;\nimport kd.hr.hom.common.enums.InitTypeEnum;\nimport kd.sdk.hr.hom.business.onbrd.IOnbrdService;\n\nimport java.security.SecureRandom;\nimport java.util.Date;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\npublic class OnbrdServiceImpl implements IOnbrdService {\n\n    public String setEmployeeNo(DynamicObject dynamicObject, String initType) {\n\n        if (HRStringUtils.equals(InitTypeEnum.ONBRD_NEW_INTEGERATE_TSC.getValue(), initType) || HRStringUtils.equals(InitTypeEnum.ONBRD_NEW_INTEGERATE_THIRDSYS.getValue(), initType)|| HRStringUtils.equals(InitTypeEnum.ONBRD_NEW_IMPORT.getValue(), initType)) {\n            return dynamicObject.getString(\"candidatenumber\") + \"auto\";\n        }\n        return null;\n    }\n\n\npublic void beforeWrapOriginalJson(List<ImportBillData> rowdatas, Map<String, ImportLogger> importLoggerMap, String optionCode) {\n    Map<String, List<ImportBillData>> sheetMap = rowdatas.stream().collect(\n    Collectors.groupingBy(rowdata -> rowdata.getData().getJSONObject(\"data\").keySet().iterator().next()));\n    List<ImportBillData> onbrdBillRowdatas = sheetMap.get(OnbrdPersonPageConstants.HOM_PERSONWAITSTART);\n    Date date = new Date();\n    SecureRandom secureRandom = new SecureRandom();\n    StringBuilder stringBuilder = new StringBuilder();\n    stringBuilder.append(date.getTime()).append('-');\n    // 生成6位随机数\n    stringBuilder.append(secureRandom.nextInt(900000) + 100000);\n    onbrdBillRowdatas.forEach(rowdata -> {\n        JSONObject data = rowdata.getData().getJSONObject(MultiEntityImportConstants.DATA);\n        String entityName = data.keySet().iterator().next();\n        // 数据在Excel中的行号 （中台变更 由 rowdata.getDataIndex() + rowdata.getStartIndex() 改为 rowdata.getStartIndex() ）\n        // 入职单\n        JSONObject onbrdBillJson = data.getJSONObject(entityName);\n        JSONObject jsonObject = new JSONObject();\n        jsonObject.put(\"importprop\", \"number\");\n        jsonObject.put(\"number\", stringBuilder.toString());\n        onbrdBillJson.put(\"candidate\", jsonObject);\n    });\n}\n}\n </code></pre>","commented":3,"declare":"public interface IOnbrdService","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"多实体导入-实现自定义赋值。如：候选人编号","constructor":false,"modifiers":"","name":"beforeWrapOriginalJson","paramNames":["rowdatas","importLoggerMap","optionCode"],"paramTypes":["java.util.List<ImportBillData>","java.util.Map<java.lang.String,ImportLogger>","java.lang.String"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"rowdatas        rowdatas","name":"@param","ownerType":"METHOD"},{"comment":"importLoggerMap importLoggerMap","name":"@param","ownerType":"METHOD"},{"comment":"optionCode      optionCode","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"","constructor":false,"modifiers":"","name":"setEmployeeNo","paramNames":["dynamicObject","initType"],"paramTypes":["DynamicObject","java.lang.String"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"dynamicObject 入职单","name":"@param","ownerType":"METHOD"},{"comment":"initType      枚举类型InitTypeEnum，初始化类型","name":"@param","ownerType":"METHOD"},{"comment":"工号值","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IOnbrdService","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};	
	//--></script></head><body></body></html>
