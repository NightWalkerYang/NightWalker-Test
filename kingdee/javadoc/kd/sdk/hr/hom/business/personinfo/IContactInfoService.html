		const cm={"allInterfaces":["kd.sdk.hr.hom.business.personinfo.IHcfInfoPageService"],"annotations":[{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"},{"attrs":{"name":"\"联系信息-扩展插件\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"联系信息-扩展业务插件示例\n<pre><code>\nimport kd.bos.dataentity.entity.DynamicObject;\nimport kd.bos.dataentity.entity.DynamicObjectCollection;\nimport kd.bos.entity.datamodel.IDataModel;\nimport kd.bos.form.IFormView;\nimport kd.bos.logging.Log;\nimport kd.bos.logging.LogFactory;\nimport kd.bos.orm.util.CollectionUtils;\nimport kd.hr.hbp.common.constants.HRBaseConstants;\nimport kd.hr.hbp.common.util.HRObjectUtils;\nimport kd.hr.hom.business.application.extension.IContactInfoService;\nimport kd.hr.hom.common.constant.HcfCandidateConstants;\nimport kd.hr.hom.common.constant.OnbrdPersonFieldConstants;\n\nimport java.util.Objects;\n\npublic class ContactInfoServiceImpl implements IContactInfoService {\n\n    private static final Log LOGGER = LogFactory.getLog(ContactInfoServiceImpl.class);\n\n\n    public String getExtPropertiesWithAddress() {\n       return \"candidate,addresstype,countrycode,addressinfo\";\n    }\n\n    public void initViewWithAddress(IFormView formView, DynamicObjectCollection hcfAddressList) {\n       if (CollectionUtils.isEmpty(hcfAddressList)) {\n           return;\n       }\n       IDataModel model = formView.getModel();\n       for (DynamicObject dynamicObject : hcfAddressList) {\n           DynamicObject addressType = dynamicObject.getDynamicObject(HcfCandidateConstants.FIELD_ADDRESSTYPE);\n           if (Objects.isNull(addressType)) {\n               continue;\n           }\n           // 地址类型编码\n           String addressTypeNumber = addressType.getString(HRBaseConstants.NUMBER);\n           switch (addressTypeNumber) {\n               case HcfCandidateConstants.ADDRESSTYPE_CN_HUKOU:\n                   // 页面字段赋值-户口所在地\n                   model.setValue(HcfCandidateConstants.REGRESIDENCECOUNTRY,\n                   dynamicObject.get(HcfCandidateConstants.FIELD_COUNTRYCODE));\n                   model.setValue(HcfCandidateConstants.REGRESIDENCEADDRESSDETAIL,\n                   dynamicObject.get(HcfCandidateConstants.FIELD_ADDRESSINFO));\n                   break;\n               case HcfCandidateConstants.ADDRESSTYPE_CN_PERSON:\n                   // 页面字段赋值-现居住地\n                   model.setValue(HcfCandidateConstants.LIVECOUNTRY, dynamicObject.get(HcfCandidateConstants.FIELD_COUNTRYCODE));\n                   model.setValue(HcfCandidateConstants.LIVEADDRESSDETAIL, dynamicObject.get(HcfCandidateConstants.FIELD_ADDRESSINFO));\n                   break;\n               case HcfCandidateConstants.ADDRESSTYPE_CN_COMMU:\n                   // 页面字段赋值-通讯地址\n                   model.setValue(HcfCandidateConstants.COMMUCOUNTRY, dynamicObject.get(HcfCandidateConstants.FIELD_COUNTRYCODE));\n                   model.setValue(HcfCandidateConstants.COMMUADDRESS, dynamicObject.get(HcfCandidateConstants.FIELD_ADDRESSINFO));\n                   break;\n               default:\n                   break;\n           }\n       }\n    }\n\n    public void setValueBeforeSaveAddress(IFormView formView, DynamicObjectCollection hcfAddressList) {\n       LOGGER.info(\"kd.hr.hom.business.application.impl.extension.ContactInfoServiceImpl.setValueBeforeSaveAddress\");\n    }\n\n    public String getExtProperties() {\n       return \"candidate,phone,peremail\";\n    }\n\n    public void initViewForExt(IFormView formView, DynamicObject hcfContactInfo) {\n       IDataModel model = formView.getModel();\n       if (!HRObjectUtils.isEmpty(hcfContactInfo)) {\n           LOGGER.info(\"===ContactInfoPlugin hcfContact==={}\");\n           model.setValue(OnbrdPersonFieldConstants.PHONE, hcfContactInfo.getString(OnbrdPersonFieldConstants.PHONE));\n           model.setValue(OnbrdPersonFieldConstants.PEREMAIL, hcfContactInfo.getString(OnbrdPersonFieldConstants.PEREMAIL));\n       }\n    }\n\n    public void setValueBeforeSave(IFormView formView, DynamicObject hcfInfoDy) {\n       IDataModel model = formView.getModel();\n       // 手机号\n       hcfInfoDy.set(OnbrdPersonFieldConstants.PHONE, model.getValue(OnbrdPersonFieldConstants.PHONE));\n       // 邮箱\n       hcfInfoDy.set(OnbrdPersonFieldConstants.PEREMAIL, model.getValue(OnbrdPersonFieldConstants.PEREMAIL));\n    }\n}\n </code></pre>","commented":4,"declare":"public interface IContactInfoService extends kd.sdk.hr.hom.business.personinfo.IHcfInfoPageService","fields":[],"interfaces":["kd.sdk.hr.hom.business.personinfo.IHcfInfoPageService"],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"获取地址的扩展字段标识集合，多个标识以英文逗号分隔开","constructor":false,"modifiers":"","name":"getExtPropertiesWithAddress","paramNames":[],"paramTypes":[],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"String 要查询的属性","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"初始化页面，给页面的地址信息字段赋值","constructor":false,"modifiers":"","name":"initViewWithAddress","paramNames":["formView","hcfAddressList"],"paramTypes":["IFormView","DynamicObjectCollection"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"formView       页面视图","name":"@param","ownerType":"METHOD"},{"comment":"hcfAddressList 候选人地址信息","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"在保存之前，给地址信息扩展字段赋值","constructor":false,"modifiers":"","name":"setValueBeforeSaveAddress","paramNames":["formView","hcfAddressList"],"paramTypes":["IFormView","DynamicObjectCollection"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"formView       页面视图","name":"@param","ownerType":"METHOD"},{"comment":"hcfAddressList 候选人地址信息","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IContactInfoService","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
