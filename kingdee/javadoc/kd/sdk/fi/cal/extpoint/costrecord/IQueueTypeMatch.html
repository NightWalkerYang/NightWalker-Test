		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"核算成本记录序列类型处理扩展插件\""},"name":"kd.sdk.annotation.SdkPlugin"},{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"}],"comment":"","commented":2,"declare":"public interface IQueueTypeMatch","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"获取序列类型","constructor":false,"modifiers":"public","name":"getQueueType","paramNames":["costAccountId","bizEntityObject","billId"],"paramTypes":["java.lang.Long","java.lang.String","java.lang.Long"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"costAccountId  成本账簿ID","name":"@param","ownerType":"METHOD"},{"comment":"bizEntityObject 业务对象","name":"@param","ownerType":"METHOD"},{"comment":"billId  业务单据ID","name":"@param","ownerType":"METHOD"},{"comment":"queueType: \"0\"为入库序列，\"1\"为出库序列，其余结果无效\n \n <p>扩展示例如下\n <pre><code> \n package kd.sdk.fi.cal.extpoint.costrecord;\n\nimport kd.bos.dataentity.entity.DynamicObject;\nimport kd.bos.orm.query.QFilter;\nimport kd.bos.servicehelper.QueryServiceHelper;\nimport kd.bos.util.StringUtils;\nimport kd.sdk.fi.cal.extpoint.costrecord.IQueueTypeMatch;\n\npublic class SrcBill4QueuePlugin_Test implements IQueueTypeMatch {\n\t\n\tpublic String getQueueType(Long costAccountId, String bizEntityObject, Long billId) {\n\t\t//非销售出库单 或者 账簿不等于指定账簿，直接返回\n\t\tif(!bizEntityObject.equals(\"im_saloutbill\") || costAccountId != 88888888L){\n\t\t\treturn null;\n\t\t}\n\t\tQFilter q = new QFilter(\"bizbillid\", \"=\", billId);\n\t\tq.and(\"costaccount.ismainaccount\", \"=\", true);\n\t\tDynamicObject info = QueryServiceHelper.queryOne(\"cal_costrecord\", \"id,period,entry.srcbillentity,entry.srcbillid\", q.toArray());\n\t\t//没有成本记录，则无需判断插件逻辑，直接返回\n\t\tif(info == null){\n\t\t\treturn null;\n\t\t}\n\t\tString srcMainEntity = info.getString(\"entry.srcbillentity\");\n\t\t//来源单类型为空，直接返回\n\t\tif(StringUtils.isEmpty(srcMainEntity)){\n\t\t\treturn null;\n\t\t}\n\t\tlong period = info.getLong(\"period\");\n\t\tlong srcBillId = info.getLong(\"entry.srcbillid\");\n\t\tDynamicObject srcInfo = null;\n\t\t//源单类型相同，都是销售出库单\n\t\tif(bizEntityObject.equals(srcMainEntity)){\n\t\t\tq = new QFilter(\"bizbillid\", \"=\", srcBillId);\n\t\t\tq.and(\"costaccount.ismainaccount\", \"=\", true);\n\t\t\t//源单\n\t\t\tsrcInfo = QueryServiceHelper.queryOne(\"cal_costrecord\", \"id,period,entry.srcbillentity,entry.srcbillid\", q.toArray());\n\t\t\t//VMI红字销售出库单源单蓝字销售出库单为物流单不进核算\n\t\t\tif(srcInfo == null){\n\t\t\t\treturn null;\n\t\t\t}\n\t\t\tlong srcPeriod = srcInfo.getLong(\"period\");\n\t\t\t//源单类型=销售出库单且源单为往期（期间不等）\n\t\t\tif(period != srcPeriod){\n\t\t\t\t//返回为入库序列\n\t\t\t\treturn \"0\";\n\t\t\t}\n\t\t}\n\t\treturn null;\n\t}\n}\n</code></pre>","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IQueueTypeMatch","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
