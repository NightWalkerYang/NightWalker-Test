veObject.set(\"taskcreatestatus\", \"C\");\n            msgReceiveObject.set(\"errormsg\", ex.getMessage());\n        }\n        // 更新业务事件日志状态\n        SaveServiceHelper.save(new DynamicObject[] {msgReceiveObject});\n        // 设置返回值\n        event.setResult(true);\n    }\n}\n </code></pre>","constructor":false,"modifiers":"default","name":"afterSaveReceiveMsg","paramNames":["event"],"paramTypes":["kd.sdk.swc.hpdi.common.events.msgreceive.AfterSaveReceiveMsgEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"event 业务事件日志后置扩展事件，result 为扩展埋点事件处理结果，是否继续执行标品逻辑，true-继续执行标品逻辑，false-不继续执行标品逻辑。","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"ICollaMsgReceiveExtService","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
