<!DOCTYPE html><html><head><meta charset="utf-8"><title>IBizDataListExtPlugin</title><script type="text/javascript" src="../../../../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"业务数据列表扩展接口\""},"name":"kd.sdk.annotation.SdkPlugin"}],"comment":"业务数据列表-二开插件","commented":2,"declare":"public interface IBizDataListExtPlugin","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"列表的超链接，可重写，打开指定的页面或者不打开。\n\n 对于通过接口入库的业务数据，在业务数据列表展示的时候，单据编号那一列，标品提供了超链接到提报单据，\n 而对于接口数据则无对应的单据，此时需要二开自己制定打开方案。\n\n <pre><code>\n\n public class BizDataListExtDemoPlugin implements IBizDataListExtPlugin {\n\n     public void billListHyperLinkClick(BizDataHyperLinkClickArgs args){\n\n         //必须先判断列名再写扩展代码，否则可能导致其他单元格的超链接也被覆盖。\n         // 若是单据编号字段\n         if (SWCStringUtils.equals(BizDataConstants.KEY_APPLY_NO, args.getArgs().getHyperLinkClickEvent().getFieldName())) {\n\n             IListView listView = (IListView) args.getView();\n             Long id = (Long) listView.getFocusRowPkId();\n\n             DynamicObject bizData = HPDIDataServiceHelper.HPDI_BIZDATA_HELPER.queryOne(\"submission\", id);\n             if (SWCObjectUtils.isEmpty(bizData)) {\n                 args.getView().showErrorNotification(ResManager.loadKDString(\"关联单据不存在\", \"BizDataList_0\", \"swc-hpdi-formplugin\"));\n                 return;\n             }\n\n             //若是数据集成的数据\n             if(\"1\".equals(bizData.getString(\"submission\"))){\n                 return;\n             }\n\n             //满足自定义的条件后，取消标品的连接，再打开自己的连接\n             args.getArgs().setCancel(true);\n\n             BaseShowParameter parameter = new BaseShowParameter();\n             parameter.setFormId(SWCEntityConstants.HPDI_BIZDATA);\n             parameter.setPkId(id);\n             parameter.getOpenStyle().setShowType(ShowType.Modal);\n             parameter.setStatus(OperationStatus.VIEW);\n             args.getView().showForm(parameter);\n         }\n\n     }\n }\n\n</code></pre>","constructor":false,"modifiers":"default","name":"billListHyperLinkClick","paramNames":["args"],"paramTypes":["kd.sdk.swc.hpdi.common.events.bizdata.BizDataHyperLinkClickArgs"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"args 业务数据列表超链接参数；","name":"@param","ownerType":"METHOD"},{"comment":"无出参，信息均设置到入参中返回。","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IBizDataListExtPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};	
	//--></script></head><body></body></html>
