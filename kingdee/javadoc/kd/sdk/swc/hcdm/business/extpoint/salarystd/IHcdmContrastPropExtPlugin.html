<!DOCTYPE html><html><head><meta charset="utf-8"><title>IHcdmContrastPropExtPlugin</title><script type="text/javascript" src="../../../../../../../../assets/template/class.js"></script><script><!--
		const cm={"allInterfaces":[],"annotations":[{"attrs":{"name":"\"对照属性逻辑处理\""},"name":"kd.sdk.annotation.SdkPlugin"},{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"}],"comment":"","commented":4,"declare":"public interface IHcdmContrastPropExtPlugin","fields":[],"interfaces":[],"isDeprecated":false,"isPlugin":true,"isService":false,"methods":[{"annotations":[],"comment":"<h5>加载对照属性值</h5>\n <b>实现案例：</b>\n <pre><code>\n public void loadContrastPropValue(ContrastPropLoadEvent event) {\n         List<ContrastPropConfigEntity> propCfg = event.getPropCfgList()；\n         List<Long> fileIds = event.getAdjFileIdList()；\n         boolean isVersion = event.isVersion()；\n         Map<Long, Map<Long,Object>> propValues = event.getPropValues();\n         for (ContrastPropConfigEntity cfg : propCfg) {\n             switch (cfg.getNumber()){\n                 case \"1000_S\"://\t职位体系方案\n                     for (Long fileId : fileIds) {\n                         DynamicObject job = fileIdToJobMap.get(fileId);\n                         if(job != null && job.getLong(\"jobscm.id\") > 0){\n                             propValues.get(fileId).putIfAbsent(cfg.getId(),job.getLong(\"jobscm.id\"));\n                         }\n                     }\n                     break;\n                 case \"1010_S\"://\t职位序列\n                     for (Long fileId : fileIds) {\n                         DynamicObject job = fileIdToJobMap.get(fileId);\n                         if(job != null && job.getLong(\"jobseq.id\") > 0){\n                             propValues.get(fileId).putIfAbsent(cfg.getId(),job.getLong(\"jobseq.id\"));\n                         }\n                     }\n                     break;\n             }\n       }\n }\n </code></pre>","constructor":false,"modifiers":"default","name":"loadContrastPropValue","paramNames":["contrastPropLoadEvent"],"paramTypes":["kd.sdk.swc.hcdm.business.extpoint.salarystd.event.ContrastPropLoadEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"contrastPropLoadEvent","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<h5>根据标准表信息，给每个对照属性返回自定义过滤条件</h5>\n 用来支持对照属性在f7打开或引入模板下载以及对照关系引入校验时，可以对实体进行状态、权限等数据范围的限制\n <b>实现案例：</b>\n <pre><code>\n public void onGetCustomerQFilter(OnGetCustomerQFilterEvent event) {\n         String scene = event.getScene();\n         switch (scene){\n             case \"beforeF7Select\":\n                 prepareQFilterForBeforeF7(event);\n                 break;\n             case \"downloadTemplate\":\n                 prepareQFilterForBeforeDownloadTplxxx(event);\n                 break;\n             case \"importValidate\":\n                 prepareQFilterForBeforeImportValidatexxx(event);\n                 break;\n             default:break;\n         }\n     }\n\n     private void prepareQFilterForBeforeF7(OnGetCustomerQFilterEvent event) {\n         for (ContrastPropConfigEntity configEntity : event.getPropCfgList()) {\n             ArrayList<QFilter> qFilters = Lists.newArrayList();\n\n             if(configEntity.getId().equals(1050L)){//\t职级\n                 //查询职级方案的数据\n                 QFilter enableQfilter = new QFilter(\"enable\", QFilter.equals, \"1\");\n                 QFilter statusQfilter = new QFilter(\"status\", QFilter.equals, \"C\");\n                 QFilter curQfilter = new QFilter(\"iscurrentversion\", QFilter.equals, \"1\");\n                 DynamicObject[] objects = BusinessDataServiceHelper.load(\"\"hbjm_joblevelscmhr\",\"id\", new QFilter[]{enableQfilter, statusQfilter, curQfilter});\n                 Set<Long> scmIds = Arrays.stream(objects).map(o -> o.getLong(\"id\")).collect(Collectors.toSet());\n                 qFilters.add(new QFilter(\"joblevelscm\", QFilter.in, scmIds));\n             }\n             if(!qFilters.isEmpty()){\n                 event.getCustomerQFilter().put(configEntity.getId(),qFilters);\n             }\n         }\n     }\n </code></pre>","constructor":false,"modifiers":"default","name":"onGetCustomerQFilter","paramNames":["evt"],"paramTypes":["kd.sdk.swc.hcdm.business.extpoint.salarystd.event.OnGetCustomerQFilterEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"evt","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"<h5>获取标准表预览时，每个对照属性返回的自定义过滤</h5>\n 获取标准表预览时，每个对照属性返回的自定义过滤，用来在标准表预览时，过滤出指定范围的对照行\n\n <b>实现案例：</b>\n <pre><code>\n    public void onGetCustomerQFilterForStdPreview(OnGetCustomerQFilterEvent evt) {\n         Set<Long> propValueIds;\n         evt.getCustomerQFilter().put(1010L,Lists.newArrayList(new QFilter(\"id\",QFilter.in,propValueIds)));\n     }\n </code></pre>","constructor":false,"modifiers":"default","name":"onGetCustomerQFilterForStdPreview","paramNames":["evt"],"paramTypes":["kd.sdk.swc.hcdm.business.extpoint.salarystd.event.OnGetCustomerQFilterEvent"],"returnType":"void","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"evt 提示信息获取事件","name":"@param","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"IHcdmContrastPropExtPlugin","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
