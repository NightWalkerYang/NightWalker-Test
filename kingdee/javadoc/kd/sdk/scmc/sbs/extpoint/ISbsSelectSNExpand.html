		const cm={"allInterfaces":[],"annotations":[{"attrs":{},"name":"kd.sdk.annotation.SdkPublic"}],"comment":"选择已有序列号查询扩展:用于扩展选择已有序列号界面,查询执行时的sql语句逻辑<br/>\n 选择已有序列号页面为动态表单,点击查询按钮时,查询的sql是在程序中动态生成,当二开场景希望在页面上添加过滤字段时,系统并不能自动将添加字段的选择值拼接到查询sql的逻辑中<br/>\n为此,提供本扩展点用于解决以上二开扩展场景","commented":8,"declare":"public interface ISbsSelectSNExpand","fields":[{"annotations":[],"comment":"getExpandSelectMaps方法中, 查询的元数据对象的key","constantValueExpression":"\"entity\"","modifiers":"public static final","name":"SELECTMAP_KEY_ENTITY","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"java.lang.String"},{"annotations":[],"comment":"getExpandSelectMaps方法中, 指定在\"选择已有序列号\"页面的查询结果单据体中用户扩展的字段的key","constantValueExpression":"\"returncol\"","modifiers":"public static final","name":"SELECTMAP_KEY_RETURNCOL","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"java.lang.String"},{"annotations":[],"comment":"getExpandSelectMaps方法中, 指定序列号主档或轨迹上的字段的数据库字段标识的key","constantValueExpression":"\"selectcol\"","modifiers":"public static final","name":"SELECTMAP_KEY_SELECTCOL","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"java.lang.String"},{"annotations":[],"comment":"getExpandSelectMaps方法中,元数据对象的值：序列号主档","constantValueExpression":"\"bd_snmainfile\"","modifiers":"public static final","name":"SELECTMAP_VAL_SNMAINFILE","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"java.lang.String"},{"annotations":[],"comment":"getExpandSelectMaps方法中,元数据对象的值：序列号主档","constantValueExpression":"\"bd_snmovetrack\"","modifiers":"public static final","name":"SELECTMAP_VAL_SNTRACK","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"java.lang.String"}],"interfaces":[],"isDeprecated":false,"isPlugin":false,"isService":false,"methods":[{"annotations":[],"comment":"用于扩展希望添加到sql中的查询字段以及查询字段与界面返回字段的对应关系","constructor":false,"modifiers":"default","name":"getExpandSelectMaps","paramNames":["view"],"paramTypes":["IFormView"],"returnType":"java.util.List<java.util.Map<java.lang.String,java.lang.String>>","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"view 界面视图对象，通过view可得到页面上用户输入的各字段值,以及通过getFormShowParameter().getCustomParams()得到所属单据的类型和id等信息","name":"@param","ownerType":"METHOD"},{"comment":"希望添加到sql中的查询字段以及查询字段与界面返回字段的对应关系<br/>\n （1）假设用户扩展了序列号主档,增加了二开字段\"项目\"(标识project)，扩展了序列号轨迹,增加二开字段\"行类型\"，且均已经通过序列号单据配置往其中写入了值,<br/>\n （2）在\"选择已有序列号\"页面的查询结果单据体中添加字段\"项目\"(标识project_return)和\"行类型\"(标识linetype_return)，希望将查询序列号主档的项目和当前轨迹的行类型返回到查询结果新增字段中<br/>\n 基于此需求,返回值的对象示例如下:<br/>\t\n[{entity:\"bd_snmainfile\",selectcol:\"fproject\",returncol:\"project_return\"},   <br/>\n{entity:\"bd_snmovetrack\",selectcol:\"flinetype\",returncol:\"linetype_return\"}]  <br/>\n其中,（1）entity代表查询的元数据对象,当前支持序列号主档（bd_snmainfile）和序列号轨迹（bd_snmovetrack）<br/>\n（2）selectcol代表在序列号主档或轨迹上的字段的数据库字段标识<br/>\n（3）returncol代表在\"选择已有序列号\"页面的查询结果单据体中用户扩展的字段\"项目\"(标识project_return)和\"行类型\"(标识linetype_return)","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]},{"annotations":[],"comment":"用于扩展希望添加到sql中的where条件内容","constructor":false,"modifiers":"default","name":"getExpandWhere","paramNames":["view"],"paramTypes":["IFormView"],"returnType":"java.lang.String","scriptDeprecated":false,"sdkInternal":false,"tags":[{"comment":"view 界面视图对象，通过view可得到页面上用户输入的各字段值,以及通过getFormShowParameter().getCustomParams()得到所属单据的类型和id等信息","name":"@param","ownerType":"METHOD"},{"comment":"希望添加到sql中的where条件内容<br/>\n 假设用户在\"选择已有序列号\"页面也同样添加过滤条件字段\"项目\"(标识project_head)和\"行类型\"(标识linetype_head)，并希望用户填写的该字段值作为查询序列号时的过滤条件<br/>\n 基于此需求,用户可首先通过传参view得到用户在界面上选择的值,假设project_head的值为10001234，linetype_head为20004567<br/>\t\n将返回值赋值为字符串 \"bd_snmainfile.fproject = 10001234 and bd_snmovetrack.flinetype = 20004567\"即可<br/>\n注：（1）字段名前需要添加前缀\"bd_snmainfile.\"或\"bd_snmovetrack.\",用于区分是序列号主档还是序列号轨迹的对应字段标识<br/>\n（2）如无需要扩展此部分内容,返回空字符串即可<br/>\n（3）该扩展并不局限于界面添加过滤字段,可以从view得到任意可得到的内容组装为额外的过滤条件,例如用户如果希望提供小漏斗支持（不直接支持小漏斗，需扩展处理）,也可通过view对象得到小漏斗中的填选内容,并转换为String对象返回;","name":"@return","ownerType":"METHOD"}],"throwExceptions":[]}],"name":"ISbsSelectSNExpand","scriptDeprecated":false,"sdkInternal":false,"tags":[],"type":"INTERFACE","unCommented":0};
